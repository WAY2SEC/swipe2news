name: Phone alerts
# After every news update: send breaking news, the top story (8 AM / 1 PM / 7 PM IST) and district news
# to app readers who turned alerts on (OneSignal). Needs the secret ONESIGNAL_REST_KEY.
on:
  push:
    branches: [main]
    paths: ['news.json']
  workflow_dispatch:
concurrency:
  group: push-news
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send alerts
        env:
          ONESIGNAL_REST_KEY: ${{ secrets.ONESIGNAL_REST_KEY }}
        run: python3 tools/push_news.py
      - name: Save what was sent
        run: |
          git config user.name "Swipe2News Bot"; git config user.email news-bot@swipe2news.invalid
          git add push/state.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "Alerts sent $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M') IST"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
