name: Link preview check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          dig +short swipe2news.com; dig +short NS swipe2news.com
          for u in https://swipe2news.com/s/o3d886 https://swipe2news.com/s/o3d886.html https://swipe2news.com/s/rdyp84.html https://swipe2news.com/cards/o3d886.jpg; do
            for ua in "Python-urllib/3.12" "WhatsApp/2.23.20.0 A" "facebookexternalhit/1.1"; do
              echo "== $u [$ua]"; curl -s -o /tmp/b -D - -A "$ua" -I "$u" | grep -iE "^HTTP|^location|^cache-control|^age|^x-cache|^content-length|^server|^x-github" ; done; done
          curl -s -A "WhatsApp/2.23.20.0 A" https://swipe2news.com/s/o3d886.html | grep -o '<meta property="og:[^>]*>' | head -5
          python3 -c "import urllib.request as u;print(u.urlopen(u.Request('https://swipe2news.com/s/o3d886',method='HEAD'),timeout=20).status)" || true
