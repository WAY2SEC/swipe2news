name: Check Learn Today lessons

# Learn Today (knowledge.json): checks every lesson when the file changes.
# Read-only: it never edits or commits anything, and it does not touch news publishing.
on:
  push:
    branches: [main]
    paths: ['knowledge.json', 'tools/check_knowledge.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check lessons
        run: python3 tools/check_knowledge.py knowledge.json --today "$(TZ=Asia/Kolkata date +%F)"
