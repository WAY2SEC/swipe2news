name: Nigeria sources test (branch nigeria-edition only)

# Test only: runs tools/ng/collect_ng.py against the live Nigerian feeds and saves the result to
# tools/ng/test-run/ on THIS branch. No secrets; never touches news.json, main or the feeds branch.
# Runs when tools/ng/REQUEST changes on nigeria-edition. Remove before any merge to main.
on:
  push:
    branches: [nigeria-edition]
    paths: ['tools/ng/REQUEST']
permissions:
  contents: write
concurrency: { group: ng-collect-test, cancel-in-progress: false }
jobs:
  collect:
    if: github.ref_name == 'nigeria-edition'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { ref: nigeria-edition, fetch-depth: 1 }
      - run: python3 tools/ng/collect_ng.py tools/ng/test-run | tee tools/ng/test-run.txt
      - run: |
          git config user.name "Swipe2News Bot"; git config user.email news-bot@swipe2news.invalid
          git add tools/ng/test-run tools/ng/test-run.txt
          git commit -qm "Nigeria sources test $(date -u +%FT%TZ)" && git push -q origin HEAD:nigeria-edition
