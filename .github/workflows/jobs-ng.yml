name: Nigeria jobs
# Nigeria edition: newest Nigerian vacancies + government recruitment news -> editions/ng/jobs.json (titles + links only, no AI).
# Three times a day. Writes only editions/ng/jobs.json (no alerts, no story checks).
on:
  schedule:
    - cron: '10 6,12,17 * * *'
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: jobs-ng, cancel-in-progress: true }
jobs:
  jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: python3 tools/ng/jobs_ng.py
      - name: Save
        run: |
          git config user.name "Swipe2News Bot"; git config user.email news-bot@swipe2news.invalid
          git add editions/ng/jobs.json; git diff --cached --quiet && exit 0
          git commit -qm "Nigeria jobs $(TZ=Africa/Lagos date '+%Y-%m-%d %H:%M') WAT"
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
