name: Android live-score test build
# Branch live-score only: builds a TEST app (debug-signed APK) to check the live score card. Publishes nothing.
on:
  push:
    branches: [live-score]
    paths: ['android/**', '.github/workflows/android-livescore-test.yml']
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build test APK
        working-directory: android
        env: { VERSION_CODE: '999' }
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: swipe2news-livescore-test, path: android/app/build/outputs/apk/debug/*.apk }
