<!doctype html>
<html lang="te" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>మండీ ధరలు ఈరోజు – తెలంగాణ, ఆంధ్రప్రదేశ్ | Mandi prices today – Swipe2News</title>
<meta name="description" content="Today's mandi (market-yard) prices for Telangana and Andhra Pradesh: paddy, cotton, chilli, maize, turmeric, groundnut, onion and more, district-wise, with date and official source.">
<link rel="canonical" href="https://swipe2news.com/mandi/">
<meta name="theme-color" content="#4A0E3F">
<meta property="og:title" content="మండీ ధరలు ఈరోజు · Mandi prices today – Swipe2News">
<meta property="og:description" content="Telangana & AP market-yard prices, district-wise, with date and source.">
<meta property="og:image" content="https://swipe2news.com/og-image.jpg">
<link rel="icon" href="/favicon-48.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Noto+Sans+Telugu:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">
<script src="/scenes.js?v=20261114l"></script>
<script src="/mandi.js?v=2"></script>
<style>
:root{--plum:#4A0E3F;--deep:#2E0827;--ap:#F5A23A;--cream:#FFFDF5;--ink:#202124;--muted:#5F6368;--line:#EDE6DF;--card:#FFFFFF;--up:#0E7A3E;--down:#B3261E}

*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit','Noto Sans Telugu',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.app{max-width:560px;margin:0 auto;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0 20px;height:calc(env(safe-area-inset-top,0px) + 60px)}
header img{height:28px;width:auto}
.pill{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--plum);font:700 13px inherit;font-family:inherit;display:inline-flex;align-items:center;gap:6px;cursor:pointer}

.hero{margin:10px 16px 0;border-radius:22px;padding:18px 20px;color:#FFFDF5;background:radial-gradient(120% 120% at 90% 0%,#6E2361 0%,#4A0E3F 55%,#3A0A31 100%);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:70px;border:18px solid rgba(255,255,255,.07)}
.hero h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px}
.hero p{margin:4px 0 0;font-size:14px;opacity:.85}
.hero .asof{display:inline-flex;margin-top:10px;padding:4px 10px;border-radius:12px;background:rgba(245,162,58,.18);color:#F5A23A;font-size:12.5px;font-weight:800}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin:14px 16px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
.seg button{height:36px;padding:0 14px;border:0;background:none;color:var(--muted);font:700 13px inherit;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--plum);color:#FFFDF5}
select{height:36px;flex:1;min-width:150px;padding:0 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 13px inherit;font-family:inherit}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 12.5px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.chip.on{border-color:var(--plum);background:rgba(74,14,63,.08);color:var(--plum)}

.fuel{margin:14px 16px 0;border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden}
.fuel h2{margin:0;padding:12px 14px 6px;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}.fuel h2 small{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.fuel .fr{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:14px;font-weight:600}.fuel .fr b{font-weight:800}.fuel .fr.me{background:rgba(245,162,58,.12)}
.fuel .fh{color:var(--muted);font-size:12px}.fuel details summary{padding:9px 14px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--plum);cursor:pointer}
.note{margin:12px 16px 0;padding:10px 12px;border-radius:12px;background:rgba(245,162,58,.12);font-size:13px;line-height:1.5}
.grp{margin:18px 16px 0}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:17px;font-weight:800}
.gh .e{font-size:20px}
.gh small{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:8px}
.row .m{font-size:14.5px;font-weight:700}
.row .m em{font-style:normal;font-weight:600;color:var(--muted);font-size:12.5px}
.row .p{text-align:right;font-size:19px;font-weight:800;color:var(--plum)}

.row .s{font-size:12px;color:var(--muted);font-weight:600}
.row .s2{text-align:right;font-size:12px;color:var(--muted);font-weight:600}
.row .up{color:var(--up)}.row .down{color:var(--down)}
.row.me{border-color:var(--ap);box-shadow:0 0 0 1px var(--ap) inset}
.empty{margin:30px 16px;text-align:center;color:var(--muted)}
.foot{margin:22px 16px 0;font-size:12.5px;line-height:1.6;color:var(--muted)}
.foot a{color:var(--plum);font-weight:700;text-decoration:underline}

nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bn .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:64px;align-items:center}
nav.bn a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
nav.bn a.on{color:var(--plum)}


/* 14 Nov 2026 font guide: one identity, script-specific Noto fonts; logo/wordmark stays Outfit */
[lang="en"] .text,.text[lang="en"],:root[lang="en"] body{--body:'Noto Sans','Outfit',sans-serif}
[lang="hi"] .text,.text[lang="hi"],:root[lang="hi"] body{--body:'Noto Sans Devanagari','Noto Sans',sans-serif}
.text[lang="en"] h2,.text[lang="en"] .sum,.text[lang="en"] .kpts{font-family:'Noto Sans','Outfit',sans-serif}
.text[lang="hi"] h2,.text[lang="hi"] .sum,.text[lang="hi"] .kpts{font-family:'Noto Sans Devanagari','Noto Sans',sans-serif}
</style>
</head>
<body>
<div class="app">
<header><a href="/" aria-label="Swipe2News home"><img src="/logo.png" alt="swipe2news" width="140" height="28"></a><a class="pill" href="/?cards=1" id="toCards">📰 వార్తలు</a></header>
<section class="hero"><h1 id="tt">మండీ ధరలు</h1><p id="sb">ఈరోజు మార్కెట్ యార్డు ధరలు</p><span class="asof" id="asof"></span></section>
<div class="ctl"><div class="seg" role="tablist"><button id="stTG" class="on" type="button">తెలంగాణ</button><button id="stAP" type="button">ఆంధ్రప్రదేశ్</button></div><select id="dist" aria-label="District"></select></div>
<section class="fuel" id="fuel" hidden></section>
<div class="chips" id="chips"></div>
<div class="note" id="warn"></div>
<main id="list"></main>
<p class="foot" id="foot"></p>
</div>
<nav class="bn" aria-label="Main"><div class="in">
 <a href="/?cards=1"><span style="font-size:20px">📰</span><span id="n1">వార్తలు</span></a>
 <a class="on" href="/mandi/"><span style="font-size:20px">🌾</span><span id="n2">మండీ ధరలు</span></a>
 <a href="/web/?jobs=1#jobs"><span style="font-size:20px">💼</span><span id="n3">ఉద్యోగాలు</span></a>
 <a href="/morning/"><span style="font-size:20px">☀️</span><span id="n4">బ్రీఫింగ్</span></a>
</div></nav>
<script>
(async()=>{
const M=window.S2Mandi, L=M.lang(), U=M.UI[L], P=M.prefs();
document.documentElement.lang=L;
const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAV={te:['వార్తలు','మండీ ధరలు','ఉద్యోగాలు','బ్రీఫింగ్','📰 వార్తలు'],en:['News','Mandi prices','Jobs','Briefing','📰 News'],hi:['खबरें','मंडी भाव','नौकरियाँ','ब्रीफ़िंग','📰 खबरें']}[L];
['n1','n2','n3','n4'].forEach((k,i)=>$(k).textContent=NAV[i]); $('toCards').textContent=NAV[4];
$('tt').textContent=U.t; $('sb').textContent=U.sub; $('warn').textContent='ℹ️ '+U.warn;
$('stTG').textContent=L==='te'?'తెలంగాణ':L==='hi'?'तेलंगाना':'Telangana'; $('stAP').textContent=L==='te'?'ఆంధ్రప్రదేశ్':L==='hi'?'आंध्र प्रदेश':'Andhra Pradesh';
const data=await M.load();
const qs=new URLSearchParams(location.search);
let st=qs.get('st')||M.stateOf(P.place), dist=qs.get('d')||(P.place&&P.place!=='TS'&&P.place!=='AP'?P.place:''), crop=qs.get('c')||'';
if(dist && M.stateOf(dist)!==st) dist='';
const pname=k=>M.placeName(k,L);
function render(){
  $('stTG').classList.toggle('on',st==='TG'); $('stAP').classList.toggle('on',st==='AP');
  const rows=data.rows.filter(r=>r.st===st);
  const dists=[...new Set(rows.map(r=>r.place))].sort((a,b)=>pname(a).localeCompare(pname(b)));
  $('dist').innerHTML=`<option value="">${esc(U.all)} · ${esc(st==='TG'?$('stTG').textContent:$('stAP').textContent)}</option>`+dists.map(d=>`<option value="${esc(d)}"${d===dist?' selected':''}>${esc(pname(d))}</option>`).join('');
  let use=dist?rows.filter(r=>r.place===dist):rows; let note='';
  if(dist && !use.length){ use=rows; note=U.none; }
  const crops=M.ORDER.filter(k=>use.some(r=>r.crop===k)).concat([...new Set(use.map(r=>r.crop))].filter(k=>!M.ORDER.includes(k)));
  if(crop && !crops.includes(crop)) crop='';
  $('chips').innerHTML=`<button class="chip${crop?'':' on'}" data-c="">${esc(U.all)}</button>`+crops.map(k=>`<button class="chip${k===crop?' on':''}" data-c="${k}">${(M.CROPS[k]||{}).e||'•'} ${esc(M.cropName(k,L))}</button>`).join('');
  const dates=use.map(r=>r.date).sort(); $('asof').textContent=dates.length?`📅 ${U.asof}: ${M.dmy(dates[dates.length-1],L)}`:'';
  const fl=(data.fuel||[]).filter(r=>r.st===st).sort((a,b)=>(b.place===(dist||P.place))-(a.place===(dist||P.place))||a.city.localeCompare(b.city));
  if(fl.length){ const fd=fl.map(r=>r.date).sort().pop(); const row=r=>`<div class="fr${r.place===(dist||P.place)?' me':''}"><span>${esc(pname(r.place))}</span><b>${M.rs(r.petrol)}</b><b>${M.rs(r.diesel)}</b></div>`;
    $('fuel').innerHTML=`<h2>⛽ ${esc(U.fuel)}<small>₹ / ${esc(U.lit)} · ${M.dmy(fd,L)}</small></h2><div class="fr fh"><span></span><span>${esc(U.pet)}</span><span>${esc(U.dsl)}</span></div>`+fl.slice(0,3).map(row).join('')+(fl.length>3?`<details><summary>${esc(U.all)} (${fl.length})</summary>${fl.slice(3).map(row).join('')}</details>`:''); $('fuel').hidden=false; } else $('fuel').hidden=true;
  const show=crops.filter(k=>!crop||k===crop);
  $('list').innerHTML=(note?`<p class="note">${esc(note)}</p>`:'')+(show.length?show.map(k=>{
    const list=use.filter(r=>r.crop===k).sort((a,b)=>b.modal-a.modal);
    return `<section class="grp"><div class="gh"><span class="e">${(M.CROPS[k]||{}).e||'•'}</span>${esc(M.cropName(k,L))}<small>₹ / ${esc(U.q.replace(/^per /,''))}</small></div>`+list.map(r=>{
      const ch=M.change(data,r), age=M.ageDays(r.date);
      return `<div class="row${P.place&&r.place===P.place?' me':''}"><div class="m">${esc(r.mkt)} <em>· ${esc(pname(r.place))}${r.var?' · '+esc(r.var):''}</em></div><div class="p">${M.inr(r.modal)}</div>
      <div class="s">${esc(U.range)}: ${M.inr(r.min)} – ${M.inr(r.max)} · ≈ ${M.inr(Math.round(r.modal/100))}/${esc(U.kg)}</div><div class="s2">${ch?`<b class="${ch>0?'up':'down'}">${ch>0?'▲':'▼'} ${M.inr(Math.abs(ch))}</b> · `:''}${M.dmy(r.date,L)}${age>0?' ('+esc(U.old)+')':''}</div></div>`;
    }).join('')+'</section>';
  }).join(''):`<p class="empty">—</p>`);
  const srcs=[...new Set(use.map(r=>r.url).filter(u=>/^https:\/\//.test(u)))];
  $('foot').innerHTML=`${esc(U.src)}: ${esc(data.src||'Agmarknet (Govt of India)')}${data.fuelSrc?' · ⛽ '+esc(data.fuelSrc):''}. ${srcs.slice(0,4).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">${i+1}</a>`).join(' · ')}<br>${esc(U.warn)} <a href="/editorial-policy.html#mandi">${L==='te'?'మా విధానం':L==='hi'?'हमारी नीति':'Our policy'}</a>`;
  const q=new URLSearchParams(); if(st!==M.stateOf(P.place)) q.set('st',st); if(dist) q.set('d',dist); if(crop) q.set('c',crop);
  history.replaceState(null,'',location.pathname+(q.toString()?'?'+q:''));
}
$('stTG').onclick=()=>{ st='TG'; dist=''; render(); }; $('stAP').onclick=()=>{ st='AP'; dist=''; render(); };
$('dist').onchange=e=>{ dist=e.target.value; render(); };
$('chips').onclick=e=>{ const b=e.target.closest('.chip'); if(!b) return; crop=b.dataset.c; render(); };
render();
})();
</script>
</body>
</html>
