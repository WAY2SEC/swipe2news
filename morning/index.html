<style>
:root{--plum:#4A0E3F;--deep:#2E0827;--ap:#F5A23A;--cream:#FFFDF5;--ink:#202124;--muted:#5F6368;--line:#EDE6DF;--card:#FFFFFF}

*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:'Outfit','Noto Sans Telugu',system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.app{max-width:480px;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0 20px;height:calc(env(safe-area-inset-top,0px) + 60px)}
header img{height:28px;width:auto}
.hb{display:flex;gap:6px}
.pill{height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--plum);font:700 13px inherit;font-family:inherit;display:inline-flex;align-items:center;gap:6px;cursor:pointer}

.greet{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 20px 0}
.greet .d{font-size:14px;color:var(--muted);font-weight:500}
.greet h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.3px;line-height:1.25}
.greet h1 .who{color:var(--plum)}

.nm{margin-top:4px;padding:0;border:0;background:none;color:var(--muted);font:600 12.5px inherit;font-family:inherit;cursor:pointer;text-decoration:underline}
.nmf[hidden]{display:none}.nmf{display:flex;gap:6px;margin-top:6px}.nmf input{height:36px;width:170px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit;font-family:inherit}.nmf button{height:36px;width:40px;border-radius:18px;border:0;background:var(--plum);color:#fff;font-weight:800}
.sec{margin:22px 20px 0}
.lab{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--plum)}

.lab i{flex:1;height:1px;background:var(--line)}
.lab a{font-size:13px;letter-spacing:0;font-weight:700;color:var(--plum)}
.brief{position:relative;overflow:hidden;border-radius:22px;padding:20px;color:#FFFDF5;background:radial-gradient(120% 120% at 90% 0%,#6E2361 0%,#4A0E3F 55%,#3A0A31 100%)}
.brief:before{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:70px;border:18px solid rgba(255,255,255,.07)}
.brief .k{position:relative;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--ap);letter-spacing:.4px}
.brief h2{position:relative;margin:8px 0 0;font-size:22px;line-height:1.3;font-weight:800}
.brief .mix{position:relative;margin-top:6px;font-size:14px;color:#E3D3DE}
.bar{position:relative;margin-top:14px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.bar span{height:4px;border-radius:2px;background:rgba(255,255,255,.25)}.bar span.on{background:var(--ap)}
.btns{position:relative;margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button,.btns a{height:46px;border-radius:23px;border:0;display:flex;align-items:center;justify-content:center;gap:8px;font:800 15px inherit;font-family:inherit;cursor:pointer}
.btns .rd{background:#FFFDF5;color:var(--plum)}
.btns .ls{background:var(--ap);color:var(--deep)}
.btns .ls[aria-pressed="true"]{background:#FFFDF5}
.row{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
.row::-webkit-scrollbar{display:none}
.act{flex:none;width:176px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.act .ic{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.act b{font-size:15px;line-height:1.3}
.act p{margin:0;font-size:13px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.act .tg{font-size:12px;font-weight:700;color:#0E7A3E}.act .tg.rp{color:#8A4B00}
.gov{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.gov .t{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}.gov .t small{font-size:12px;color:var(--muted);font-weight:500}
.gi{display:flex;align-items:center;gap:12px}
.gi .n{flex:none;width:52px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;background:var(--plum);color:#fff}
.gi .n.o{background:var(--ap);color:var(--deep)}
.gi .n b{font-size:18px}.gi .n small{font-size:10px;font-weight:600;margin-top:2px}
.gi .x{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.gi .x b{font-size:14px;line-height:1.35}.gi .x span{font-size:12.5px;color:var(--muted)}
.gi+.gi{border-top:1px solid var(--line);padding-top:12px}
.vf{display:flex;flex-direction:column;gap:12px}
.vc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.vc .m{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.vc h3{margin:0;font-size:17px;line-height:1.4;font-weight:800}
.vc .w{font-size:13px;line-height:1.5}.vc .w b{color:var(--plum)}

.vc .e{font-size:12px;color:var(--muted)}
.tl{font-size:11px;font-weight:800;letter-spacing:.6px;border-radius:6px;padding:3px 8px}
.tl.fact{background:#0E7A3E;color:#fff}.tl.claim{background:var(--ap);color:var(--deep)}.tl.opinion{border:1px solid var(--line);color:var(--muted)}.tl.misleading{background:#B3261E;color:#fff}
.vc.mis{background:#FFF4F3;border-color:#F2C9C5}

.go{display:flex;align-items:center;justify-content:center;gap:8px;margin:22px 20px 0;height:54px;border-radius:27px;background:var(--plum);color:#fff;font-size:16px;font-weight:800}
.go small{font-weight:600;opacity:.8}
.mnd{display:block;border:1px solid var(--line);border-radius:18px;background:var(--card);padding:4px 14px}
.mnd .r{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.mnd .r:last-of-type{border-bottom:0}.mnd .r span{font-size:19px;text-align:center}.mnd .r b{font-size:15px}.mnd .r small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.mnd .r em{font-style:normal;font-size:17px;font-weight:800;color:var(--plum)}

.mnd .ft{padding:8px 0 10px;font-size:12px;color:var(--muted);font-weight:600;border-top:1px solid var(--line)}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}

nav.bn a.sw{justify-self:center;width:58px;height:58px;margin-top:-26px;border-radius:29px;background:var(--plum);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(74,14,63,.35)}

.sheet .hd{align-self:center;width:40px;height:5px;border-radius:3px;background:#D8CCD4}
.sheet h2{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
.sheet .q{font-size:15px;font-weight:700;line-height:1.4}
.lbls{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lbls span{height:34px;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.lbls span.fact.on{background:#0E7A3E;border-color:#0E7A3E;color:#fff}.lbls span.claim.on{background:var(--ap);border-color:var(--ap);color:var(--deep)}.lbls span.opinion.on{background:var(--ink);color:var(--cream)}.lbls span.misleading.on{background:#B3261E;border-color:#B3261E;color:#fff}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:16px}
.tbl div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;font-size:14px}.tbl div+div{border-top:1px solid var(--line)}
.tbl span{color:var(--muted);font-size:13px}.tbl b{text-align:right}
.ev{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#F6EEF3;border-radius:14px;color:var(--ink)}

.ev i{flex:none;width:40px;height:40px;border-radius:10px;background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal}
.cor{padding:12px 14px;border:1px solid var(--line);border-radius:14px;font-size:14px}
.rep{height:50px;border-radius:25px;border:1.5px solid var(--plum);background:var(--card);color:var(--plum);font:800 15px inherit;font-family:inherit;display:flex;align-items:center;justify-content:center}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
/* language screen (web/s2n.js) */

.s2lsc[hidden]{display:none}.s2lsc .in{width:min(560px,100%)}.s2lsc .lhd img{height:34px}.s2lsc h1{margin:18px 0 0;font-size:28px;font-weight:800}.s2lsc .lsub{margin:6px 0 0;color:#5A5560}

.s2lsc .lt{position:relative;display:flex;align-items:center;gap:12px;height:72px;padding:0 14px;border-radius:16px;border:1.5px solid #E3D7DF;background:#fff;color:#202124;font:inherit;text-align:left}
.s2lsc .lt .lg{flex:none;width:44px;height:44px;border-radius:12px;background:#F6EEF3;color:#4A0E3F;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.s2lsc .lt .ln{font-weight:700}.s2lsc .lt .soon{position:absolute;top:6px;right:8px;font-size:9.5px;font-weight:800;color:#8A4B00;background:#FDEBD3;border-radius:6px;padding:1px 5px}
.s2lsc .lt.on{background:#4A0E3F;border-color:#4A0E3F;color:#FFFDF5}.s2lsc .lt.on .lg{background:#F5A23A;color:#2E0827}
.s2lsc .lgo{width:100%;margin-top:24px;height:56px;border:0;border-radius:28px;background:#4A0E3F;color:#FFFDF5;font:inherit;font-size:17px;font-weight:800}
.s2lsc .lnm{display:flex;flex-direction:column;gap:6px;margin-top:18px;font-size:14px;font-weight:700;color:#202124}
.s2lsc .lnm small{font-weight:500;color:#5A5560}
.s2lsc .lnm input{height:48px;padding:0 14px;border-radius:14px;border:1.5px solid #E3D7DF;background:#fff;font:600 16px 'Outfit','Noto Sans Telugu',sans-serif;color:#202124}
.s2bnav,.tkpause{display:none!important}
.m60{margin:14px 16px 0}
.m60t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.m60t h2{margin:0;font-size:20px;font-weight:800;color:var(--plum);line-height:1.4}
.m60t span{flex:none;font-size:12px;color:var(--muted)}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mi a{display:flex;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none}
.mi .no{flex:none;width:26px;height:26px;border-radius:13px;background:var(--plum);color:#FFFDF5;font:800 13px 'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;margin-top:2px}
.mi:first-child .no{background:var(--ap);color:var(--deep)}
.mi .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mi .k{font-size:11.5px;font-weight:800;letter-spacing:.3px;color:var(--plum)}
.mi h3{margin:0;font-size:16px;line-height:1.45;font-weight:800;color:var(--ink)}
.mi p{margin:0;font-size:13.5px;line-height:1.55;color:#3C3A40}
.mi .sr{font-size:11.5px;color:var(--muted);margin-top:2px}
.mi .sr b{font-weight:700;color:#0E7A3E}
.mload,.mnone{padding:16px;color:var(--muted);font-size:14px}
.macts{display:grid;grid-template-columns:1.1fr 1.2fr .8fr;gap:8px;margin-top:12px}
.ma{height:46px;border-radius:23px;border:0;font:800 14px 'Noto Sans Telugu','Outfit',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;cursor:pointer;padding:0 8px}
.ma.ls{background:var(--ap);color:var(--deep)}.ma.ls[aria-pressed="true"]{background:var(--deep);color:#FFFDF5}
.ma.rd{background:var(--plum);color:#FFFDF5}
.ma.sh{background:var(--card);color:var(--plum);border:1.5px solid var(--plum)}
.mend{display:block;text-align:center;margin:14px 0 6px;font-size:13px;font-weight:700;color:var(--plum);text-decoration:none}
</style>

<script>
const PLACES={hyderabad:'హైదరాబాద్',rangareddy:'రంగారెడ్డి',medchal:'మేడ్చల్',adilabad:'ఆదిలాబాద్',bhadradri:'భద్రాద్రి',hanumakonda:'హనుమకొండ',jagtial:'జగిత్యాల',jangaon:'జనగామ',bhupalpally:'భూపాలపల్లి',gadwal:'గద్వాల',kamareddy:'కామారెడ్డి',karimnagar:'కరీంనగర్',khammam:'ఖమ్మం',asifabad:'ఆసిఫాబాద్',mahabubabad:'మహబూబాబాద్',mahabubnagar:'మహబూబ్‌నగర్',mancherial:'మంచిర్యాల',medak:'మెదక్',mulugu:'ములుగు',nagarkurnool:'నాగర్‌కర్నూల్',nalgonda:'నల్గొండ',narayanpet:'నారాయణపేట',nirmal:'నిర్మల్',nizamabad:'నిజామాబాద్',peddapalli:'పెద్దపల్లి',sircilla:'సిరిసిల్ల',sangareddy:'సంగారెడ్డి',siddipet:'సిద్దిపేట',suryapet:'సూర్యాపేట',vikarabad:'వికారాబాద్',wanaparthy:'వనపర్తి',warangal:'వరంగల్',yadadri:'యాదాద్రి'}
;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('w2s.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('w2s.'+k,JSON.stringify(v))}catch(e){}}};

function openHow(s){ const k=LBL[s.lbl]?s.lbl:'';
  const c=s.corr&&(s.corr[L]||s.corr.te);
  $('howIn').innerHTML=`<div class="hd"></div><h2><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E7A3E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>${esc(TX.how)}</h2>
    <div class="q">${esc(s.h)}</div>
    <div class="lbls">${['fact','claim','opinion','misleading'].map(x=>`<span class="${x}${x===k?' on':''}">${esc(LBL[x][L])}</span>`).join('')}</div>
    <div class="tbl"><div><span>${esc(TX.pub)}</span><b>${esc(s.src||'Swipe2News')}</b></div><div><span>${esc(TX.when)}</span><b>${esc((s.d||'')+' '+hm(s))}${c&&s.corr.at?' · '+esc(s.corr.at):''}</b></div><div><span>${esc(TX.sum)}</span><b>${esc(TX.ai)}</b></div></div>
    ${/^https?:/.test(s.url||'')?`<a class="ev" href="${esc(s.url)}" target="_blank" rel="noopener"><i>📄</i><span style="flex:1"><b style="display:block;font-size:14px">${esc(TX.ev)}</b><span style="font-size:12px;color:var(--muted)">${esc(TX.evs)}</span></span>↗</a>`:''}
    <div class="cor"><b>${esc(TX.corr)}:</b> ${c?esc(c):esc(TX.none)}</div>
    <a class="rep" href="https://wa.me/917032656422?text=${encodeURIComponent('Swipe2News – error report / తప్పు సమాచారం:\n'+(s.h||'')+'\nhttps://swipe2news.com/s/'+s._id)}" target="_blank" rel="noopener">${esc(TX.report)}</a>
    <a class="go" style="margin:0" href="/?cards=1&s=${s._id}">${esc(TX.read)}</a>`;
  $('how').hidden=false; }
$('how').onclick=e=>{ if(e.target===$('how')) $('how').hidden=true; };

/* Listen: one audio track for the whole briefing; its real length is remembered after the first play */
let t0=0;
const lenTx=()=>{ const s=store.get('m60sec',0); return s?' '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):''; };
$('mlisten').onclick=()=>{ const sy=window.speechSynthesis, b=$('mlisten'); if(!sy) return;
  if(b.getAttribute('aria-pressed')==='true'){ sy.cancel(); t0=0; b.setAttribute('aria-pressed','false'); b.textContent=TX.listen+lenTx(); return; }
  const u=new SpeechSynthesisUtterance(TX.intro+BRIEF.map((it,i)=>{ const x=it.s||it.job; return `${i+1}. ${it.k}. ${x.h}. ${it.job?(it.days===0?TX.todayLast:TX.last+' '+x.last):(String(x.why||x.p||'').split(/(?<=[.!?।])\s/)[0]||'')}`; }).join(' '));
  u.lang={te:'te-IN',en:'en-IN',hi:'hi-IN'}[L]; u.rate=1; const v=sy.getVoices().find(v=>v.lang.replace('_','-').toLowerCase().startsWith(u.lang.slice(0,2))); if(v) u.voice=v;
  u.onstart=()=>{ t0=Date.now(); };
  u.onend=()=>{ if(t0){ const s=Math.round((Date.now()-t0)/1000); if(s>5) store.set('m60sec',s); } t0=0; b.setAttribute('aria-pressed','false'); b.textContent=TX.listen+lenTx(); };
  u.onerror=()=>{ t0=0; b.setAttribute('aria-pressed','false'); b.textContent=TX.listen; };
  sy.cancel(); sy.speak(u); b.setAttribute('aria-pressed','true'); b.textContent=TX.stop; };
</script>
<script src="/web/s2n.js?v=3" defer></script>
