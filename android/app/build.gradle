plugins { id 'com.android.application' }

// Swipe2News Android app: a Trusted Web Activity that opens https://swipe2news.com full-screen.
// Version: set by the build (GitHub run number), so every build can go to Play Store.
def vCode = (System.getenv('VERSION_CODE') ?: '1') as int
def ks = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.swipe2news.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.swipe2news.app'
        minSdk 21
        targetSdk 34
        versionCode vCode
        versionName "1.0." + vCode
        manifestPlaceholders = [
            hostName: 'swipe2news.com',
            defaultUrl: 'https://swipe2news.com/?source=android',
            launcherName: 'Swipe2News',
            themeColor: '#4A0E3F',
            navColor: '#2E0827',
            backgroundColor: '#2E0827'
        ]
        resValue 'string', 'app_name', 'Swipe2News'
    }
    signingConfigs {
        release {
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'swipe2news'
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
