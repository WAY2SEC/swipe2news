<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swipe2News ఎడిటర్ | వార్తల ఆమోదం</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2E0827"><link rel="icon" href="/favicon-48.png"><link rel="manifest" href="/editor/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@500;700;800&display=swap">
<style>
:root{--navy:#2E0827;--brand:#4A0E3F;--gold:#F5A23A;--paper:#F4F1EA;--ink:#16120E;--muted:#6B5F52;--line:#E2D8C8;--ok:#1F6B3A;--te:'Noto Sans Telugu','Nirmala UI',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--te)}
.top{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top img{height:28px} .top b{font-size:16px;color:var(--gold);margin-right:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none} .tabs button{white-space:nowrap;flex:none;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:999px;padding:6px 12px;font:800 13px var(--te);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.tabs .n{display:inline-block;min-width:20px;border-radius:999px;background:var(--brand);color:#fff;font-size:11px;margin-left:4px;padding:0 5px}
main{max-width:760px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right,0px)) 40px max(14px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ph{width:100%;max-height:360px;object-fit:contain;background:#EDE7DC;display:block}
.bd{padding:14px;display:grid;gap:8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font:700 12.5px var(--te);color:var(--muted)}
.meta a{color:#0B5CAD}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font:800 11.5px var(--te);color:#fff;background:#8A7E70}
.chip.risk{background:#6A1B9A} .src2{font:700 13px var(--te);color:#0B5CAD} ul.pts{margin:0;padding-left:20px;font:500 14.5px/1.7 var(--te)}
.edsw{display:flex;gap:8px;margin:0 0 12px}.edsw button{flex:1;padding:10px;border-radius:12px;border:1.5px solid #ddd;background:#fff;font-weight:700;font-size:14px}.edsw button[aria-pressed=true]{background:#4A0E3F;color:#fff;border-color:#4A0E3F}.edsw .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:#F5A23A;color:#2E0827;font-size:12px;margin-left:4px}.chip.lbl{background:#666}
.chip.pending{background:#B7791F} .chip.approved{background:#0B5CAD} .chip.published{background:var(--ok)} .chip.rejected{background:var(--brand)}
h3{margin:0;font:800 17px/1.5 var(--te)} .tx{margin:0;font:500 15px/1.75 var(--te);white-space:pre-wrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.acts button{height:50px;border:0;border-radius:14px;font:800 16px var(--te);cursor:pointer;color:#fff}
.yes{background:var(--ok)} .no{background:var(--brand)}
.note{margin:0 14px 10px;width:calc(100% - 28px);font:600 14px var(--te);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px}
.login{background:#fff;border-radius:16px;padding:18px;display:grid;gap:12px;border:1px solid var(--line)}
.login input{font:600 16px var(--te);border:1.5px solid var(--line);border-radius:12px;padding:11px}
.login button{height:48px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:800 15px var(--te);cursor:pointer}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:40px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font:800 14px var(--te);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.pf{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.pf label{display:grid;gap:5px;font:800 13px var(--te);color:var(--brand)} .pf small{font:600 12px/1.5 var(--te);color:var(--muted)}
.pf select,.pf input[type=text],.pf input[type=url]{font:600 15px var(--te);border:1.5px solid var(--line);border-radius:10px;padding:10px;width:100%}
.pf .chk{display:flex;gap:8px;align-items:flex-start;font:600 13.5px/1.5 var(--te);color:var(--ink)} .pf .chk input{margin-top:4px;width:20px;height:20px}
.pf .prev{width:100%;max-height:260px;object-fit:contain;background:#EDE7DC;border-radius:12px} .pf button.go{height:50px;border:0;border-radius:14px;background:var(--ok);color:#fff;font:800 16px var(--te)}
.pf button.go:disabled{opacity:.5} .rule{background:#FFF6E6;border:1px solid #F5C77A;border-radius:12px;padding:10px 12px;font:600 13px/1.6 var(--te)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><a href="/"><img src="/logo-light.png" alt="Swipe2News"></a><b>✅ ఎడిటర్</b>
  <div class="tabs" id="tabs"><button type="button" data-f="pending" aria-pressed="true">పెండింగ్<span class="n" id="nP">0</span></button><button type="button" data-f="approved" aria-pressed="false">ఆమోదించినవి</button><button type="button" data-f="all" aria-pressed="false">అన్నీ</button><button type="button" data-f="web" aria-pressed="false">🔎 వెబ్ వార్తలు<span class="n" id="nW">0</span></button><button type="button" data-f="photo" aria-pressed="false">📷 అధికారిక ఫోటో</button><button type="button" id="refresh" aria-label="రిఫ్రెష్">↻</button></div>
</header>
<main id="main">
  <div class="login" id="login" hidden>
    <b>ఎడిటర్ కీ</b>
    <input id="key" type="password" autocomplete="off" placeholder="ఎడిటర్ కీ టైప్ చేయండి">
    <button type="button" id="keyGo">లాగిన్</button>
    <small style="color:var(--muted)">కీ ఈ ఫోన్‌లోనే సేవ్ అవుతుంది. ఎవరితోనూ పంచుకోకండి.</small>
  </div>
  <div id="list"></div>
</main>
<div class="toast" id="toast" hidden></div>
<script src="/scenes.js"></script>
<script src="/reporter/config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const st={get(){try{return localStorage.getItem('w2s.editorKey')||''}catch(e){return ''}},set(v){try{localStorage.setItem('w2s.editorKey',v)}catch(e){}}};
let ITEMS=[], WEB=[], F='pending';
const ST={pending:'పరిశీలనలో',approved:'ఆమోదించారు – త్వరలో ప్రచురణ',published:'ప్రచురించారు',rejected:'తిరస్కరించారు'};
function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2400); }
async function call(body){ const r=await fetch(window.W2S_NEWSROOM,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:st.get()},body))}); return r.json(); }
const placeTx=k=>(typeof placeLabel==='function'&&placeLabel(k))||k;
/* Web news held for approval (Mixed approval, 27 Nov 2026): separate India and Nigeria queues (story.ed "in"/"ng"). */
let ED=(()=>{try{return localStorage.getItem('w2s.editorEd')||'in'}catch(e){return 'in'}})();
const edOf=i=>((i.story||{}).ed==='ng'?'ng':'in');
const VS={official:'✔ అధికారిక మూలం · Official source',confirmed:'✔ 2+ మూలాలు · Confirmed by 2+ outlets',single:'⚠ ఒకే మూలం · Single source',editor:'✔ ఎడిటర్ ఆమోదం · Editor approved'};
function renderWeb(){
  const ng=ED==='ng', mine=WEB.filter(i=>edOf(i)===ED);
  const cnt=e=>WEB.filter(i=>edOf(i)===e&&i.status==='pending').length;
  const l=mine.filter(i=>i.status==='pending').concat(mine.filter(i=>i.status!=='pending'));
  const sw=`<div class="edsw"><button type="button" data-ed="in" aria-pressed="${!ng}">🇮🇳 India <span class="n">${cnt('in')}</span></button><button type="button" data-ed="ng" aria-pressed="${ng}">🇳🇬 Nigeria <span class="n">${cnt('ng')}</span></button></div>`;
  const T=ng?{st:{pending:'Waiting for approval',approved:'Approved – publishing soon',published:'Published',rejected:'Rejected'},pub:'Source published',read:'Read original source →',note:"Editor note (optional) – e.g. 'say clearly this is an allegation'",yes:'✅ Publish',no:'❌ Reject',empty:'No held Nigeria stories 👍',link:'🔗 Story',also:'Also reported by'}
           :{st:ST,pub:'మూలం ప్రచురణ',read:'అసలు వార్త చదవండి →',note:"ఎడిటర్ నోట్ (ఐచ్ఛికం) – ఉదా: 'ఆరోపణ' అని స్పష్టంగా రాయండి",yes:'✅ ప్రచురించు',no:'❌ వద్దు',empty:'ఆపిన వెబ్ వార్తలు లేవు 👍',link:'🔗 వార్త',also:'ఇతర మూలాలు'};
  $('list').innerHTML=sw+(l.length?l.map(i=>{ const s=i.story||{}, en=(!ng&&s.en)||null, srcs=Array.isArray(s.srcs)?s.srcs:[]; return `<article class="card" data-id="${esc(i.id)}" data-web="1">
    <div class="bd">
      <div class="meta"><span class="chip ${esc(i.status)}">${esc(T.st[i.status]||i.status)}</span><span class="chip risk">⚠️ ${esc(i.risk)}</span><span>🕒 ${esc(i.time)}</span>${i.link?`<a href="${esc(i.link)}" target="_blank" rel="noopener">${T.link}</a>`:''}</div>
      <div class="meta"><span>${esc(s.cat||'')}</span>${s.pub?`<span>${T.pub}: ${esc(String(s.pub).replace('T',' ').slice(0,16))}</span>`:''}${s.lbl?`<span class="chip lbl">${esc(String(s.lbl).toUpperCase())}</span>`:''}${s.vs&&VS[s.vs]?`<span>${esc(ng?VS[s.vs].split(' · ')[1]:VS[s.vs])}</span>`:''}</div>
      <h3>${esc(s.h||i.headline)}</h3>
      <p class="tx">${esc(s.p||'')}</p>
      ${en&&en.h?`<p class="tx" style="color:var(--muted)"><b>EN:</b> ${esc(en.h)} – ${esc(en.p||'')}</p>`:''}
      ${Array.isArray(s.pts)&&s.pts.length?`<ul class="pts">${s.pts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      <a class="src2" href="${esc(i.url)}" target="_blank" rel="noopener nofollow">📰 ${esc(i.source||s.src||'')} – ${T.read}</a>
      ${srcs.length?`<small style="color:var(--muted)">${T.also}: ${srcs.map(x=>`<a href="${esc(x.u)}" target="_blank" rel="noopener nofollow">${esc(x.n)}</a>`).join(' · ')}</small>`:''}
      ${i.note?`<small style="color:var(--muted)">📝 ${esc(i.note)}</small>`:''}
    </div>
    ${i.status==='pending'?`<input class="note" placeholder="${esc(T.note)}">
    <div class="acts"><button type="button" class="yes" data-d="approve">${T.yes}</button><button type="button" class="no" data-d="reject">${T.no}</button></div>`:''}
  </article>`; }).join(''):`<div class="empty">${T.empty}</div>`);
  document.querySelectorAll('.edsw button').forEach(b=>b.onclick=()=>{ ED=b.dataset.ed; try{localStorage.setItem('w2s.editorEd',ED)}catch(e){} renderWeb(); });
}

/* ---------- 📷 official photo for a published story (15 Nov 2026) ----------
   Only photos released for media use: government press releases (PIB, CMO, I&PR) or a party's / leader's OFFICIAL handle.
   Same rule for every party. Credit + source link are required; the reporter-stories task attaches the photo at its next run. */
let NEWS=[], PHOTOS=[];
/* major parties – national, Telangana, Andhra Pradesh, Tamil Nadu (same treatment for all; alphabetical within each group) */
const PARTIES=[['ప్రభుత్వం / పదవి',['ప్రభుత్వం (కేంద్రం)','ప్రభుత్వం (తెలంగాణ)','ప్రభుత్వం (ఆంధ్రప్రదేశ్)','ప్రభుత్వం (తమిళనాడు)','రాజ్యాంగ పదవి (రాష్ట్రపతి, గవర్నర్…)']],
 ['జాతీయ పార్టీలు',['కాంగ్రెస్ (INC)','బీజేపీ (BJP)','సీపీఐ (CPI)','సీపీఐ(ఎం) (CPI-M)']],
 ['తెలంగాణ',['ఎంఐఎం (AIMIM)','బీఆర్ఎస్ (BRS)','కాంగ్రెస్ (INC)','బీజేపీ (BJP)']],
 ['ఆంధ్రప్రదేశ్',['జనసేన (JSP)','టీడీపీ (TDP)','వైఎస్సార్సీపీ (YSRCP)','కాంగ్రెస్ (INC)','బీజేపీ (BJP)']],
 ['తమిళనాడు',['అన్నాడీఎంకే (AIADMK)','డీఎంకే (DMK)','డీఎండీకే (DMDK)','నామ్ తమిళర్ కట్చి (NTK)','పీఎంకే (PMK)','టీవీకే (TVK)','వీసీకే (VCK)','కాంగ్రెస్ (INC)','బీజేపీ (BJP)']],
 ['ఇతర',['ఇతర పార్టీ (క్రెడిట్ పేరులో రాయండి)','స్వతంత్ర']]];
const CREDITS=['PIB · భారత ప్రభుత్వం','PMO India','రాష్ట్రపతి భవన్','తెలంగాణ సీఎంఓ','తెలంగాణ I&PR','ఏపీ సీఎంఓ','ఏపీ I&PR','తమిళనాడు సీఎంఓ','తమిళనాడు DIPR','పార్టీ అధికారిక ఖాతా','నేత అధికారిక ఖాతా','ఇతర ప్రభుత్వ శాఖ'];
const sidOf=x=>{ if(x._sid) return x._sid; let h=5381; const t=(x.url||'')+'|'+(x.h||''); for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return (h>>>0).toString(36); };
async function renderPhoto(){
  $('list').innerHTML='<div class="empty">లోడ్ అవుతోంది…</div>';
  try{ const j=await (await fetch('/news.json?'+Date.now())).json(); NEWS=(j.stories||j||[]).filter(x=>x&&x.h&&!x.kind); }catch(e){ NEWS=[]; }
  try{ const p=await call({action:'offphotolist'}); PHOTOS=(p&&p.ok&&p.items)||[]; }catch(e){ PHOTOS=[]; }
  $('list').innerHTML=`<div class="pf" id="pf">
    <div class="rule">📷 <b>ప్రభుత్వ ప్రెస్ రిలీజ్ (PIB, సీఎంఓ, I&PR)</b> లేదా <b>పార్టీ/నేత అధికారిక ఖాతా</b> విడుదల చేసిన ఫోటోలు మాత్రమే. పత్రికలు, ఏజెన్సీలు (PTI, ANI), ఫోటోగ్రాఫర్ల ఫోటోలు వద్దు. <b>అన్ని పార్టీలకూ ఒకే నియమం.</b> క్రెడిట్ ఫోటో మీద కనిపిస్తుంది.</div>
    <label>వార్త వెతకండి<input type="search" id="pQ" placeholder="ఉదా: రేవంత్, మోదీ, సీఎం"></label>
    <label>వార్త ఎంచుకోండి (${NEWS.length} వార్తలు)<select id="pSid"><option value="">— వార్త —</option>${NEWS.map(x=>`<option value="${esc(sidOf(x))}">${esc((x.pub||x.t||'').toString().slice(5,10).replace('-','/'))} · ${esc(x.h)}</option>`).join('')}</select></label>
    <label>ఫోటో<input type="file" id="pFile" accept="image/*"></label><img class="prev" id="pPrev" hidden alt="">
    <label>క్రెడిట్<select id="pCr">${CREDITS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></label>
    <label>క్రెడిట్ పేరు (ఐచ్ఛికం)<input type="text" id="pCrN" maxlength="60" placeholder="ఉదా: BRS పార్టీ, ఒవైసీ అధికారిక ఖాతా"><small>"పార్టీ/నేత అధికారిక ఖాతా" అయితే పార్టీ లేదా నేత పేరు రాయండి</small></label>
    <label>ఫోటోలో ఉన్నవారు<input type="text" id="pWho" maxlength="80" placeholder="ఉదా: సీఎం రేవంత్ రెడ్డి, ప్రధాని మోదీ"></label>
    <label>పార్టీ / పదవి<select id="pParty">${PARTIES.map(([g,l])=>`<optgroup label="${esc(g)}">${l.map(x=>`<option>${esc(x)}</option>`).join('')}</optgroup>`).join('')}</select><small>ప్రభుత్వ కార్యక్రమం అయితే "ప్రభుత్వం" ఎంచుకోండి. అన్ని పార్టీలకూ ఒకే నియమం.</small></label>
    <label>ఫోటో దొరికిన లింక్ (తప్పనిసరి)<input type="url" id="pSrc" placeholder="https://pib.gov.in/… లేదా అధికారిక పోస్ట్ లింక్"></label>
    <label class="chk"><input type="checkbox" id="pOk"><span>ఇది అధికారికంగా మీడియా కోసం విడుదల చేసిన ఫోటో అని, ఎడిట్ చేయలేదని నిర్ధారిస్తున్నాను.</span></label>
    <button type="button" class="go" id="pGo" disabled>📤 ఫోటో పంపండి</button>
    <small>తర్వాతి రిపోర్టర్ రన్‌లో (గంటకు ఒకసారి) యాప్‌లో వస్తుంది.</small>
  </div>
  ${PHOTOS.length?PHOTOS.map(r=>`<article class="card"><div class="bd"><div class="meta"><span class="chip ${esc(r.status==='published'?'published':r.status==='rejected'?'rejected':'approved')}">${esc(r.status==='published'?'యాప్‌లో ఉంది':r.status==='rejected'?'వాడలేదు':'వరుసలో')}</span><span>🕒 ${esc(r.time)}</span><span>📷 ${esc(r.credit)}</span>${r.link?`<a href="${esc(r.link)}" target="_blank" rel="noopener">🔗 వార్త</a>`:''}</div><h3>${esc(r.headline)}</h3>${r.note?`<small style="color:var(--muted)">📝 ${esc(r.note)}</small>`:''}</div></article>`).join(''):''}`;
  const chk=()=>{ $('pGo').disabled=!($('pSid').value&&$('pFile').files[0]&&/^https:\/\//.test($('pSrc').value.trim())&&$('pOk').checked); };
  const fillCr=()=>{ if(/అధికారిక ఖాతా/.test($('pCr').value)&&!$('pCrN').value.trim()&&!/^ప్రభుత్వం|^రాజ్యాంగ|^ఇతర|^స్వతంత్ర/.test($('pParty').value)) $('pCrN').value=$('pParty').value.replace(/\s*\(.*\)$/,''); };
  $('pCr').addEventListener('change',fillCr); $('pParty').addEventListener('change',fillCr);
  ['pSid','pFile','pSrc','pOk'].forEach(k=>$(k).addEventListener('input',chk));
  $('pQ').addEventListener('input',()=>{ const q=$('pQ').value.trim().toLowerCase(); const sel=$('pSid'); const opts=NEWS.filter(x=>!q||((x.h||'')+' '+((x.en&&x.en.h)||'')+' '+(x.s||'')).toLowerCase().includes(q)); sel.innerHTML='<option value="">— '+opts.length+' వార్తలు —</option>'+opts.map(x=>`<option value="${esc(sidOf(x))}">${esc(x.h)}</option>`).join(''); chk(); }); $('pOk').addEventListener('change',chk);
  $('pFile').addEventListener('change',()=>{ const f=$('pFile').files[0]; if(f){ $('pPrev').src=URL.createObjectURL(f); $('pPrev').hidden=false; } chk(); });
  $('pGo').onclick=async()=>{ $('pGo').disabled=true; $('pGo').textContent='పంపుతోంది…';
    try{ const data=await shrink($('pFile').files[0]); const st=NEWS.find(x=>sidOf(x)===$('pSid').value)||{};
      const cr=[$('pCr').value,$('pCrN').value.trim()].filter(Boolean).join(' · ');
      const j=await call({action:'offphoto',sid:$('pSid').value,headline:st.h||'',credit:cr,person:$('pWho').value.trim(),party:$('pParty').value.trim(),srcurl:$('pSrc').value.trim(),data});
      if(j.ok){ toast('✅ పంపారు – తర్వాతి రన్‌లో యాప్‌లో వస్తుంది'); renderPhoto(); } else { toast('కుదరలేదు: '+(j.error||'')); $('pGo').disabled=false; $('pGo').textContent='📤 ఫోటో పంపండి'; } }
    catch(e){ toast('ఇంటర్నెట్ సమస్య'); $('pGo').disabled=false; $('pGo').textContent='📤 ఫోటో పంపండి'; } };
}
function shrink(f){ return new Promise((ok,no)=>{ const im=new Image(); im.onload=()=>{ const W=Math.min(1600,im.naturalWidth), H=Math.round(im.naturalHeight*W/im.naturalWidth); const c=document.createElement('canvas'); c.width=W; c.height=H; c.getContext('2d').drawImage(im,0,0,W,H); ok(c.toDataURL('image/jpeg',0.88)); }; im.onerror=no; im.src=URL.createObjectURL(f); }); }
function render(){
  $('nP').textContent=ITEMS.filter(i=>i.status==='pending').length;
  $('nW').textContent=WEB.filter(i=>i.status==='pending').length;
  if(F==='web') return renderWeb();
  if(F==='photo') return renderPhoto();
  const l=ITEMS.filter(i=>F==='all'||i.status===F);
  $('list').innerHTML=l.length?l.map(i=>`<article class="card" data-id="${esc(i.id)}">
    ${i.photo?`<img class="ph" data-photo="${esc(i.id)}" alt="ఫోటో లోడ్ అవుతోంది…">`:''}
    <div class="bd">
      <div class="meta"><span class="chip ${esc(i.status)}">${esc(ST[i.status]||i.status)}</span><span>👤 ${esc(i.reporter)}</span><span>📍 ${esc(i.place)}, ${esc(placeTx(i.district))}</span><span>🕒 ${esc(i.time)}</span>
        ${i.lat?`<a href="https://maps.google.com/?q=${esc(i.lat)},${esc(i.lng)}" target="_blank" rel="noopener">🗺️ మ్యాప్</a>`:''}${i.link?`<a href="${esc(i.link)}" target="_blank" rel="noopener">🔗 వార్త</a>`:''}</div>
      ${i.headline?`<h3>${esc(i.headline)}</h3>`:''}
      <p class="tx">${esc(i.text)}</p>
      ${i.note?`<small style="color:var(--muted)">📝 ${esc(i.note)}</small>`:''}
    </div>
    ${i.status==='pending'?`<input class="note" placeholder="ఎడిటర్ నోట్ (ఐచ్ఛికం) – ఉదా: పేరు తీసేయండి">
    <div class="acts"><button type="button" class="yes" data-d="approve">✅ ఆమోదించు</button><button type="button" class="no" data-d="reject">❌ తిరస్కరించు</button></div>`:''}
  </article>`).join(''):`<div class="empty">${F==='pending'?'కొత్త వార్తలు లేవు 👍':'ఏమీ లేవు'}</div>`;
  document.querySelectorAll('img[data-photo]').forEach(async im=>{ try{ const j=await call({action:'photo',id:im.dataset.photo}); if(j.ok) im.src=j.data; }catch(e){} });
}
async function load(){ if(!window.W2S_NEWSROOM){ $('list').innerHTML='<div class="empty">న్యూస్‌రూమ్ ఇంకా కనెక్ట్ కాలేదు.</div>'; return; }
  if(!st.get()){ $('login').hidden=false; return; } $('login').hidden=true;
  $('list').innerHTML='<div class="empty">లోడ్ అవుతోంది…</div>';
  try{ const j=await call({action:'list'}); if(!j.ok){ st.set(''); $('login').hidden=false; $('list').innerHTML='<div class="empty">కీ సరిగ్గా లేదు</div>'; return; } ITEMS=j.items||[]; try{ const w=await call({action:'reviewlist'}); WEB=(w&&w.ok&&w.items)||[]; }catch(e){ WEB=[]; } render(); }
  catch(e){ $('list').innerHTML='<div class="empty">ఇంటర్నెట్ సమస్య – ↻ నొక్కండి</div>'; } }
$('keyGo').onclick=()=>{ const k=$('key').value.trim(); if(k.length<6) return; st.set(k); load(); };
$('tabs').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; if(b.id==='refresh') return load(); F=b.dataset.f; $('tabs').querySelectorAll('button[data-f]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); render(); };
$('list').addEventListener('click',async e=>{ const b=e.target.closest('button[data-d]'); if(!b) return; const card=b.closest('.card'), id=card.dataset.id, note=card.querySelector('.note').value.trim();
  card.querySelectorAll('button').forEach(x=>x.disabled=true);
  const web=!!card.dataset.web;
  try{ const j=await call({action:web?'reviewdecide':'decide',id,decision:b.dataset.d,note}); if(j.ok){ const it=(web?WEB:ITEMS).find(x=>x.id===id); it.status=j.status; it.note=note; render();
      toast(web&&ED==='ng'?(j.status==='approved'?'✅ Approved – it goes live on the Nigeria app at the next run':'❌ Rejected'):(j.status==='approved'?'✅ ఆమోదించారు – 1 గంటలోపు యాప్, వెబ్‌సైట్‌లో వస్తుంది':'❌ తిరస్కరించారు')); } else toast('కుదరలేదు, మళ్లీ ప్రయత్నించండి'); }
  catch(x){ toast('ఇంటర్నెట్ సమస్య'); card.querySelectorAll('button').forEach(x=>x.disabled=false); } });
load();
</script>
</body>
