<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Corrections – Swipe2News Nigeria</title><meta name="robots" content="noindex"><meta name="theme-color" content="#4A0E3F"><link rel="icon" href="/art/logo.svg">
<style>body{margin:0;background:#FFFDF5;color:#202124;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}.w{max-width:560px;margin:0 auto;padding:18px}
a{color:#4A0E3F}h1{font-size:24px;color:#4A0E3F;margin:10px 0 4px}.k{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff;background:#B7791F}.k.withdrawn{background:#B3261E}
.it{border-top:1px solid #eadfce;padding:14px 0}.it h2{font-size:17px;margin:6px 0}.it p{margin:4px 0;line-height:1.5}.m{color:#777;font-size:13px}</style></head>
<body><div class="w"><a href="/ng/">‹ Back to Swipe2News Nigeria</a>
<h1>Corrections & withdrawals</h1><p class="m">When we get a fact wrong, we fix it and list it here. Spot a mistake? Email <a href="mailto:swipe2news@gmail.com">swipe2news@gmail.com</a> or tap ⚑ Report on any card.</p>
<div id="l"><p class="m">Loading…</p></div></div>
<script>const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('/editions/ng/corrections.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{const it=(d.items||[]);document.getElementById('l').innerHTML=it.length?it.map(x=>`<div class="it"><span class="k ${esc(x.kind)}">${x.kind==='withdrawn'?'WITHDRAWN':'CORRECTED'}</span> <span class="m">${esc(x.at)}</span><h2>${esc(x.h)}</h2><p>${esc(x.en)}</p>${x.url?`<p class="m">Original source: <a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url.replace(/^https?:\/\//,'').split('/')[0])}</a></p>`:''}</div>`).join(''):'<p class="m">No corrections yet.</p>';}).catch(()=>{document.getElementById('l').innerHTML='<p class="m">Could not load the list.</p>';});</script>
</body></html>
