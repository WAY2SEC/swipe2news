<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swipe2News Nigeria – Know More. Scroll Less.</title>
<meta name="robots" content="noindex,nofollow"><!-- test edition: hidden from search until launch -->
<meta name="theme-color" content="#4A0E3F">
<link rel="icon" href="/art/logo.svg">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#4A0E3F;--deep:#2E0827;--apricot:#F5A23A;--cream:#FFFDF5;--paper:#F5EBDD;--ink:#202124;--muted:#6B6160;--green:#0E7A3E;--line:#E8DDD0;
  --ui:'Outfit',system-ui,sans-serif;--tx:'Noto Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--tx);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:520px;margin:0 auto;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px calc(8px);padding-top:max(10px,env(safe-area-inset-top));background:var(--cream);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--plum);font:800 20px var(--ui);letter-spacing:-.02em}
.brand img{width:30px;height:30px;border-radius:8px}.brand i{color:var(--apricot);font-style:normal}
.ed{margin-left:auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:700 13px var(--ui);color:var(--plum);cursor:pointer}
.beta{font:700 10px var(--ui);letter-spacing:.08em;color:var(--deep);background:var(--apricot);border-radius:6px;padding:2px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--cream);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:700 13px var(--ui);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
main{flex:1;position:relative;overflow:hidden;padding:12px 12px 0}
.card{position:absolute;inset:12px 12px 0;display:flex;flex-direction:column;background:#fff;border-radius:22px 22px 0 0;overflow:hidden;box-shadow:0 6px 24px rgba(46,8,39,.12);touch-action:pan-y;transition:transform .28s ease,opacity .28s ease}
.pic{position:relative;flex:0 0 36%;min-height:170px;background:var(--plum);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic .mark{width:84px;height:84px;border-radius:20px;box-shadow:0 0 0 2px rgba(255,253,245,.55)}
.pic .dot{position:absolute;right:16px;bottom:14px;width:12px;height:12px;border-radius:50%;background:var(--apricot)}
.pill{position:absolute;top:12px;left:12px;background:rgba(255,253,245,.94);color:var(--plum);border-radius:999px;padding:5px 11px;font:700 12px var(--ui)}
.num{position:absolute;left:14px;right:40px;bottom:12px;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.num b{font:800 22px var(--ui);color:var(--apricot)}.num span{font:700 15px var(--ui);color:#fff;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow-y:auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px}
h1{font:700 22px/1.3 var(--ui);color:var(--ink);letter-spacing:-.01em}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font:600 13px var(--ui);color:var(--muted)}
.lbl{border-radius:6px;padding:2px 8px;font:800 11px var(--ui);letter-spacing:.06em}
.lbl.fact{background:var(--green);color:#fff}.lbl.claim{background:var(--apricot);color:var(--deep)}.lbl.opinion{border:1.5px solid #9A918C;color:#5E5652}
.lbl.forecast{background:#1F5FA8;color:#fff}
p.sum{font:400 16px/1.6 var(--tx);color:var(--ink)}
.src{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 13px var(--ui);color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.src a{color:var(--plum);font-weight:800;text-decoration:none;white-space:nowrap}
.acts{display:flex;gap:8px;padding:0 16px 12px}
.acts button,.acts a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:700 14px var(--ui);color:var(--plum);text-decoration:none;cursor:pointer}
.acts .wa{background:#0E7A3E;border-color:#0E7A3E;color:#fff}
.dock{display:flex;align-items:center;gap:10px;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:var(--cream);border-top:1px solid var(--line);position:relative}
.dock:before{content:"";position:absolute;left:0;top:-1px;height:3px;width:var(--prog,0%);background:var(--apricot);box-shadow:0 0 8px var(--apricot);transition:width .25s}
.dock button{height:44px;border-radius:999px;border:0;font:800 14px var(--ui);cursor:pointer}
.prev{width:44px;background:#fff;border:1.5px solid var(--line)!important;color:var(--plum)}
.next{margin-left:auto;padding:0 22px;background:var(--apricot);color:var(--deep)}
.count{font:700 13px var(--ui);color:var(--muted)}.tag{font:700 12px var(--ui);color:var(--plum)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font:600 15px/1.6 var(--ui);color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(32,33,36,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet[hidden]{display:none}
.sheet>div{width:100%;max-width:520px;background:var(--cream);border-radius:22px 22px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));display:grid;gap:10px}
.sheet h2{font:800 18px var(--ui);color:var(--plum)}.sheet p{font:500 14px/1.5 var(--ui);color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:700 15px var(--ui);color:var(--ink);cursor:pointer}
.opt small{display:block;font:500 13px var(--ui);color:var(--muted)}.opt[aria-current=true]{border-color:var(--plum);box-shadow:0 0 0 2px var(--plum) inset}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--deep);color:#fff;font:600 14px var(--ui);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <a class="brand" href="/ng/" aria-label="Swipe2News Nigeria"><img src="/art/logo.svg" alt=""><span>swipe2news<i>.</i></span></a>
  <button class="ed" id="ed" type="button" aria-haspopup="dialog" aria-label="Choose your country">🇳🇬 Nigeria <span class="beta">BETA</span> ▾</button>
</header>
<nav class="chips" id="chips" aria-label="Sections"></nav>
<main id="stage"><div class="empty" id="msg">Loading Nigeria news…</div></main>
<div class="dock" id="dock">
  <button class="prev" id="prev" type="button" aria-label="Previous story">‹</button>
  <span class="count" id="count"></span>
  <span class="tag">Know More. Scroll Less.</span>
  <button class="next" id="next" type="button">Next ›</button>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT"><div>
  <h2 id="shT">Choose your country</h2>
  <p>We show the news for the country you pick. Your choice is saved on this phone. (Nigeria is in testing.)</p>
  <button class="opt" type="button" data-ed="ng" aria-current="true">🇳🇬<span>Nigeria<small>English · Nigerian and world news</small></span></button>
  <button class="opt" type="button" data-ed="in">🇮🇳<span>India<small>Telangana &amp; Andhra Pradesh · తెలుగు · English · हिन्दी</small></span></button>
  <button class="opt" type="button" data-close style="justify-content:center">Close</button>
</div></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* Swipe2News – Nigeria edition (test, 24 Nov 2026). Reads /editions/ng/news.json (same format as /news.json, English text).
   Opened automatically for phones on Nigerian time (Africa/Lagos) or with ?ed=ng; ?ed=in or the edition menu goes back. */
(function(){
const FEED='/editions/ng/news.json', KEY='s2n.ng.feed';
const SECS=[['all','All'],['politics','Politics'],['business','Business'],['lagos','Lagos'],['security','Security'],['sports','Sports'],['world','World']];
const LBL={fact:'FACT',claim:'CLAIM',opinion:'OPINION',forecast:'FORECAST'};
const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ALL=[], list=[], i=0, sec='all';
const q=new URLSearchParams(location.search);
function sid(s){ let h=5381; const t=(s.url||'')+'|'+(s.h||''); for(let k=0;k<t.length;k++) h=((h<<5)+h+t.charCodeAt(k))|0; return (h>>>0).toString(36); }
function when(s){ try{ const d=new Date(s.pub); return d.toLocaleString('en-NG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Africa/Lagos'})+' WAT'; }catch(e){ return (s.d||'')+' '+(s.t||''); } }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function chips(){ const have=new Set(ALL.flatMap(s=>s.sec||[]));
  $('chips').innerHTML=SECS.filter(([k])=>k==='all'||have.has(k)).map(([k,l])=>`<button class="chip" type="button" data-s="${k}" aria-pressed="${k===sec}">${l}</button>`).join(''); }
function pick(){ list=sec==='all'?ALL:ALL.filter(s=>(s.sec||[]).includes(sec)); if(i>=list.length) i=0; }
function card(s){
  const share=location.origin+'/ng/?s='+sid(s);
  const wa='https://wa.me/?text='+encodeURIComponent(s.h+'\n'+share);
  return `<article class="card" id="card">
    <div class="pic"><img class="mark" src="/art/logo.svg" alt=""><span class="pill">${esc(s.cat)}</span>
      <div class="num"><b>${esc(s.stat)}</b><span>${esc(s.statl)}</span></div><i class="dot"></i></div>
    <div class="body"><h1>${esc(s.h)}</h1>
      <div class="meta"><span>${esc(when(s))}</span>${s.lbl?`<span class="lbl ${esc(s.lbl)}">${LBL[s.lbl]||esc(s.lbl)}</span>`:''}</div>
      <p class="sum">${esc(s.p)}</p>
      <div class="src"><span>Source: ${esc(s.src)}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">Read full story ›</a></div></div>
    <div class="acts"><button type="button" id="share">↗ Share</button><a class="wa" href="${wa}" target="_blank" rel="noopener">WhatsApp</a></div>
  </article>`; }
function show(dir){
  pick(); const st=$('stage');
  if(!list.length){ st.innerHTML='<div class="empty">No stories here yet. Pull down or come back soon.</div>'; $('count').textContent=''; return; }
  st.innerHTML=card(list[i]); const c=$('card');
  if(dir){ c.style.transform=`translateX(${dir*40}px)`; c.style.opacity='.3'; requestAnimationFrame(()=>{ c.style.transform=''; c.style.opacity=''; }); }
  $('count').textContent=(i+1)+'/'+list.length; $('dock').style.setProperty('--prog',((i+1)/list.length*100)+'%');
  $('prev').disabled=i===0; $('next').textContent=i===list.length-1?'Start again ↺':'Next ›';
  $('share').onclick=()=>{ const s=list[i], u=location.origin+'/ng/?s='+sid(s);
    if(navigator.share) navigator.share({title:s.h,text:s.h,url:u}).catch(()=>{}); else { navigator.clipboard&&navigator.clipboard.writeText(u); toast('Link copied'); } };
  swipe(c);
}
function go(d){ if(!list.length) return; const n=i+d; if(n<0) return; i=n>=list.length?0:n; show(d); }
function swipe(c){ let x0=null,y0=0,dx=0;
  c.addEventListener('pointerdown',e=>{ if(e.target.closest('a,button')) return; x0=e.clientX; y0=e.clientY; dx=0; });
  c.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; if(Math.abs(dx)>Math.abs(e.clientY-y0)) c.style.transform=`translateX(${dx*.6}px) rotate(${dx/60}deg)`; });
  const end=()=>{ if(x0===null) return; x0=null; c.style.transform=''; if(dx<-60) go(1); else if(dx>60) go(-1); };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end); c.addEventListener('pointerleave',end); }
function use(d){ ALL=(d&&d.stories)||[]; chips(); const want=q.get('s'); if(want){ const k=ALL.findIndex(s=>sid(s)===want); if(k>=0) i=k; } show(0); }
async function load(){
  let cached=null; try{ cached=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(cached) use(cached);
  try{ const r=await fetch(FEED,{cache:'no-cache'}); if(!r.ok) throw 0; const d=await r.json(); try{ localStorage.setItem(KEY,JSON.stringify(d)); }catch(e){} if(!cached||cached.updated!==d.updated) use(d); }
  catch(e){ if(!cached) $('stage').innerHTML='<div class="empty">Could not load the news. Check your internet and try again.</div>'; else toast('Offline – showing saved news'); }
}
$('chips').onclick=e=>{ const b=e.target.closest('[data-s]'); if(!b) return; sec=b.dataset.s; i=0; chips(); show(0); };
$('prev').onclick=()=>go(-1); $('next').onclick=()=>go(1);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
$('ed').onclick=()=>{ $('sheet').hidden=false; };
$('sheet').onclick=e=>{ const b=e.target.closest('[data-ed],[data-close]'); if(e.target===$('sheet')||(b&&b.dataset.close!==undefined)) return $('sheet').hidden=true;
  if(b&&b.dataset.ed==='in'){ try{ localStorage.setItem('s2n.edition','in'); }catch(x){} location.href='/?ed=in'+(q.has('source')?'&source='+encodeURIComponent(q.get('source')):''); }
  else if(b) $('sheet').hidden=true; };
load();
})();
</script>
</body>
</html>
