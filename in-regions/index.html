<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swipe2News India Regions (preview) – Know More. Scroll Less.</title>
<meta name="robots" content="noindex,nofollow"><!-- PREVIEW: not linked from the app, hidden from search -->
<meta name="theme-color" content="#4A0E3F">
<link rel="icon" href="/art/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--plum:#4A0E3F;--deep:#2E0827;--apricot:#F5A23A;--cream:#FFFDF5;--paper:#F5EBDD;--ink:#202124;--muted:#6B6160;--green:#0E7A3E;--line:#E8DDD0;
  --ui:'Outfit',system-ui,sans-serif;--tx:'Noto Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);font-family:var(--tx);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{display:flex;flex-direction:column;max-width:520px;margin:0 auto;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px calc(8px);padding-top:max(10px,env(safe-area-inset-top));background:var(--cream);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--plum);font:800 20px var(--ui);letter-spacing:-.02em}
.brand img{width:30px;height:30px;border-radius:8px}.brand i{color:var(--apricot);font-style:normal}
.bell{margin-left:auto;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:17px;cursor:pointer}.bell[aria-pressed=true]{background:var(--apricot);border-color:var(--apricot)}
.bell:not([hidden])+.ed{margin-left:0}
.ed{margin-left:auto;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:700 13px var(--ui);color:var(--plum)}
.beta{font:700 10px var(--ui);letter-spacing:.08em;color:var(--deep);background:var(--apricot);border-radius:6px;padding:2px 6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:var(--cream);scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:700 13px var(--ui);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
main{flex:1;position:relative;overflow:hidden;padding:12px 12px 0}
.card{position:absolute;inset:12px 12px 0;display:flex;flex-direction:column;background:#fff;border-radius:22px 22px 0 0;overflow:hidden;box-shadow:0 6px 24px rgba(46,8,39,.12);touch-action:pan-y;transition:transform .28s ease,opacity .28s ease}
.pic{position:relative;flex:0 0 36%;min-height:170px;background:var(--plum);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic .mark{width:84px;height:84px;border-radius:20px;box-shadow:0 0 0 2px rgba(255,253,245,.55)}
.pic .dot{position:absolute;right:16px;bottom:14px;width:12px;height:12px;border-radius:50%;background:var(--apricot)}
.pill{position:absolute;top:12px;left:12px;background:rgba(255,253,245,.94);color:var(--plum);border-radius:999px;padding:5px 11px;font:700 12px var(--ui)}
.num{position:absolute;left:14px;right:40px;bottom:12px;display:flex;align-items:baseline;gap:8px;white-space:nowrap;overflow:hidden}
.num b{font:800 22px var(--ui);color:var(--apricot)}.num span{font:700 15px var(--ui);color:#fff;overflow:hidden;text-overflow:ellipsis}
.body{flex:1;overflow-y:auto;padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px}
h1{font:700 22px/1.3 var(--ui);color:var(--ink);letter-spacing:-.01em}
.meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font:600 13px var(--ui);color:var(--muted)}
.lbl{border-radius:6px;padding:2px 8px;font:800 11px var(--ui);letter-spacing:.06em}
.lbl.fact{background:var(--green);color:#fff}.lbl.claim{background:var(--apricot);color:var(--deep)}.lbl.opinion{border:1.5px solid #9A918C;color:#5E5652}
.lbl.forecast{background:#1F5FA8;color:#fff}
p.sum{font:400 16px/1.6 var(--tx);color:var(--ink)}
.src{display:flex;justify-content:space-between;align-items:center;gap:10px;font:600 13px var(--ui);color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.src a{color:var(--plum);font-weight:800;text-decoration:none;white-space:nowrap}
.acts{display:flex;gap:8px;padding:0 16px 12px}
.acts button,.acts a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:700 14px var(--ui);color:var(--plum);text-decoration:none;cursor:pointer}
.acts .wa{background:#0E7A3E;border-color:#0E7A3E;color:#fff}
.dock{display:flex;align-items:center;gap:10px;padding:10px 14px max(12px,env(safe-area-inset-bottom));background:var(--cream);border-top:1px solid var(--line);position:relative}
.dock:before{content:"";position:absolute;left:0;top:-1px;height:3px;width:var(--prog,0%);background:var(--apricot);box-shadow:0 0 8px var(--apricot);transition:width .25s}
.dock button{height:44px;border-radius:999px;border:0;font:800 14px var(--ui);cursor:pointer}
.prev{width:44px;background:#fff;border:1.5px solid var(--line)!important;color:var(--plum)}
.next{margin-left:auto;padding:0 22px;background:var(--apricot);color:var(--deep)}
.count{font:700 13px var(--ui);color:var(--muted)}.tag{font:700 12px var(--ui);color:var(--plum)}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;font:600 15px/1.6 var(--ui);color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(32,33,36,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet[hidden]{display:none}
.sheet>div{width:100%;max-width:520px;background:var(--cream);border-radius:22px 22px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));display:grid;gap:10px}
.sheet h2{font:800 18px var(--ui);color:var(--plum)}.sheet p{font:500 14px/1.5 var(--ui);color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:700 15px var(--ui);color:var(--ink);cursor:pointer}
.opt small{display:block;font:500 13px var(--ui);color:var(--muted)}.opt[aria-current=true]{border-color:var(--plum);box-shadow:0 0 0 2px var(--plum) inset}
.wel{position:fixed;inset:0;z-index:20;background:#3A0A31;display:flex;flex-direction:column;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow-y:auto}
.wel[hidden]{display:none}.wel img{width:100%;max-width:420px;max-height:68vh;object-fit:contain;border-radius:18px}
.wel button{width:100%;max-width:420px;min-height:48px;border-radius:14px;border:0;font:800 16px var(--ui);cursor:pointer}
.wel .go{background:var(--apricot);color:var(--deep)}.wel .al{background:#fff;color:var(--plum)}.wel .in{background:transparent;color:#F5EBDD;font:600 14px var(--ui);min-height:36px}
.gcard{background:var(--deep);justify-content:flex-start}
.gcard .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom}
.gcard .sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,253,245,.94) 0%,rgba(255,253,245,.82) 46%,rgba(255,253,245,0) 72%)}
.gcard.night .sh{background:linear-gradient(180deg,rgba(18,14,48,.92) 0%,rgba(18,14,48,.72) 46%,rgba(18,14,48,0) 72%)}
.gcard .gt{position:relative;padding:22px 22px 0;display:flex;flex-direction:column;gap:6px}
.gcard .lg{display:flex;align-items:center;gap:10px;margin:0 auto 14px}.gcard .lg img{width:46px;height:46px;border-radius:12px}
.gcard .lg b{display:block;font:800 26px var(--ui);color:var(--plum);letter-spacing:-.02em}.gcard .lg b i{color:var(--apricot);font-style:normal}
.gcard .lg small{display:block;font:600 13px var(--ui);color:var(--deep)}
.gcard h2{font:800 46px/1.02 var(--ui);color:var(--deep);letter-spacing:-.02em}
.gcard h2 em{display:block;color:#F07B1D;font-style:italic}.gcard h2 em span{font-style:normal}
.gcard .ul{width:150px;height:5px;border-radius:5px;background:linear-gradient(90deg,#F07B1D,var(--apricot));margin:4px 0 10px}
.gcard .sub{border-left:4px solid #F07B1D;padding-left:12px;font:700 19px/1.35 var(--ui);color:var(--deep);max-width:300px}
.gcard.night h2,.gcard.night .sub,.gcard.night .lg b,.gcard.night .lg small{color:#fff}
.gcard .hint{position:absolute;left:0;right:0;bottom:0;padding:16px;text-align:center;font:800 15px var(--ui);color:#fff;background:linear-gradient(transparent,rgba(46,8,39,.85))}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--deep);color:#fff;font:600 14px var(--ui);padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:10}
.toast.on{opacity:1}

.ed{gap:8px}.ed b{font:800 10px var(--ui);letter-spacing:.08em;color:var(--deep);background:var(--apricot);border-radius:6px;padding:2px 6px}
body{overflow-x:hidden}header{gap:8px}.brand span{white-space:nowrap}
.srcbtn{margin-left:auto;flex:none;white-space:nowrap;height:36px;border-radius:999px;border:1.5px solid var(--line);background:#fff;padding:0 11px;font:700 13px var(--ui);color:var(--plum);cursor:pointer}
.ed{flex:none;padding:0;border:0;background:none;white-space:nowrap}.ed b{font-size:11px;padding:5px 8px}
.srcbtn+.ed{margin-left:0}
.brand span{position:relative}.pv{position:absolute;left:0;top:100%;font:800 8.5px var(--ui);letter-spacing:.1em;color:var(--deep);background:var(--apricot);border-radius:4px;padding:1px 4px;font-style:normal}
.areabtn{max-width:44vw;overflow:hidden;text-overflow:ellipsis}
.loc input{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:500 16px var(--ui);background:#fff;color:var(--ink)}
.loc input:focus{outline:2px solid var(--plum);outline-offset:1px}
.loc .gps{width:100%;height:46px;border:0;border-radius:12px;background:var(--plum);color:#fff;font:800 15px var(--ui);cursor:pointer;margin:10px 0}
.loc .res{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.loc .res button,.loc .rgl button{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;font:700 15px var(--ui);color:var(--ink);cursor:pointer;text-align:left}
.loc .res small,.loc .rgl small{white-space:nowrap;font:600 12px var(--ui);color:var(--muted)}
.loc .rgl{display:grid;grid-template-columns:1fr 1fr;gap:6px}.loc .rgl.one{grid-template-columns:1fr}
.loc>div>*{flex:none}.loc .rgl:not(.one) button{flex-direction:column;align-items:flex-start;gap:2px}
.loc .back[hidden]{display:none}.loc .back{display:block;text-align:left;width:auto;border:0;background:none;color:var(--plum);font:800 14px var(--ui);cursor:pointer;padding:4px 0;align-self:flex-start}
.loc .near{border-color:var(--plum)!important;box-shadow:inset 0 0 0 1.5px var(--plum)}
.loc .whole{background:var(--cream)!important}
.loc .rgl button[aria-pressed=true]{border-color:var(--plum);box-shadow:inset 0 0 0 1.5px var(--plum)}
.loc .note{font:600 13px var(--ui);color:var(--muted);margin:4px 0 8px}
.loc .save{border:0;background:none;color:var(--plum);font:800 14px var(--ui);text-decoration:underline;cursor:pointer;padding:6px 0}
.loc.wel{align-items:stretch;padding:0}.loc.wel>div{width:100%;max-width:none}.loc.wel>div{max-height:none;height:100%;border-radius:0;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.loc .wlogo{width:64px;height:64px;border-radius:18px;margin-bottom:10px}
.loc.wel h2{font-size:28px;line-height:1.15}
.ecard{justify-content:center;align-items:center;text-align:center;gap:12px;padding:28px 22px}
.ecard h2{font:800 26px/1.15 var(--ui);color:var(--plum)}.ecard p{font:500 15px/1.5 var(--ui);color:var(--muted)}
.ecard button{height:46px;border-radius:999px;padding:0 20px;font:800 15px var(--ui);cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--plum)}
.ecard .pri{background:var(--plum);color:#fff;border-color:var(--plum)}
.icard{background:linear-gradient(160deg,var(--plum),var(--deep));color:#fff;justify-content:center;padding:26px 22px;gap:14px}
.icard h2{font:800 30px/1.1 var(--ui);letter-spacing:-.02em}.icard h2 i{color:var(--apricot);font-style:normal}
.icard p{font:500 15px/1.5 var(--ui);color:#F5EBDD}
.icard .rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.icard .rg button{border:1.5px solid rgba(255,253,245,.35);background:rgba(255,253,245,.08);color:#fff;border-radius:14px;padding:10px 12px;text-align:left;font:700 14px var(--ui);cursor:pointer}
.icard .rg small{display:block;font:500 12px var(--ui);color:#F5EBDD;opacity:.85}
.icard .hint{font:800 14px var(--ui);color:var(--apricot)}
.sheet>div{max-height:86vh;overflow-y:auto}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:700 12px var(--ui);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
.grp h3{font:800 13px var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0}
.grp a{display:flex;justify-content:space-between;align-items:center;gap:10px;text-decoration:none;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:6px;font:700 14px var(--ui);color:var(--ink)}
.grp a small{font:600 12px var(--ui);color:var(--muted);white-space:nowrap}
</style>
</head>
<body>
<header>
  <a class="brand" href="/in-regions/" aria-label="Swipe2News India Regions"><img src="/art/logo.svg" alt=""><span>swipe2news<i>.</i><em class="pv">PREVIEW</em></span></a>
</header>
<main id="stage"><div class="empty">Loading regional news…</div></main>
<div class="dock" id="dock">
  <button class="prev" id="prev" type="button" aria-label="Previous story">‹</button>
  <span class="count" id="count"></span>
  <span class="tag">Know More. Scroll Less.</span>
  <button class="next" id="next" type="button">Next ›</button>
</div>
<div class="sheet loc" id="locSheet" hidden role="dialog" aria-modal="true" aria-labelledby="locT"><div>
  <img class="wlogo" id="wLogo" src="/art/logo.svg" alt="" hidden>
  <button class="back" id="locBack" type="button" hidden>‹ Choose another state</button>
  <h2 id="locT">📍 Choose your district</h2>
  <p id="locSub"></p>
  <button class="gps" id="gps" type="button">📍 Use my current location</button>
  <input id="locQ" type="search" placeholder="Search your district or city, e.g. Pune" autocomplete="off" aria-label="Search district or city">
  <div class="res" id="locRes"></div>
  <button class="save" id="locSave" type="button" hidden></button>
  <div class="note" id="locNote">Or pick your state</div>
  <div class="rgl" id="locList"></div>
  <button class="opt" type="button" id="locClose" style="justify-content:center;margin-top:10px">Show all states</button>
</div></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* Swipe2News – India Regions PREVIEW: Uttar Pradesh, Delhi, Maharashtra (incl. Mumbai), Tamil Nadu (incl. Chennai), Odisha.
   Owner, 27 Nov 2026 – works like the Telangana app, district-based:
   - First open after install: full-screen welcome → phone location, or search district/city, or state → district.
     The choice is saved as the reader's area (localStorage 's2n.area' = {st, dist}; later the login profile's area).
   - The reader then sees ONLY their state's news, their district's stories first, then the rest of the state.
   - No region row / location button at the top. The last card has "Change district or search a place":
     searching only changes the view; "Make X my district" saves it.
   Data: /editions/in-regions/news.json (stories with sec=[state] and dist=[districts]) + /editions/in-regions/districts.json.
   ?welcome=1 shows the welcome again (testing). Not linked from the app, noindex, no alerts. */
(function(){
const FEED='/editions/in-regions/news.json', DFILE='/editions/in-regions/districts.json';
const ORDER=['up','delhi','maharashtra','tamilnadu','odisha'];
const HINT={maharashtra:'incl. Mumbai',tamilnadu:'incl. Chennai'};
const LBL={fact:'FACT',claim:'CLAIM',opinion:'OPINION',forecast:'FORECAST'};
const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const q=new URLSearchParams(location.search);
let ALL=[], ST={}, list=[], i=0, AREA=null, viewing=null, firstAsk=false, step='start', stepSt=null, nearD=null;
try{ AREA=JSON.parse(lsGet('s2n.area')||'null'); if(AREA&&!AREA.st) AREA=null; }catch(e){}
const cur=()=>viewing||AREA||{st:'all',dist:''};
const SNAME=k=>k==='all'?'All states':(ST[k]?ST[k].name:k);
const aname=a=>a.st==='all'?'All states':(a.dist||SNAME(a.st));
function sid(s){ let h=5381; const t=(s.url||'')+'|'+(s.h||''); for(let k=0;k<t.length;k++) h=((h<<5)+h+t.charCodeAt(k))|0; return (h>>>0).toString(36); }
function when(s){ try{ const d=new Date(s.pub), o={day:'numeric',month:'short',timeZone:'Asia/Kolkata'};
  if(s.t){ o.hour='2-digit'; o.minute='2-digit'; o.hour12=false; } return d.toLocaleString('en-IN',o)+(s.t?' IST':''); }catch(e){ return (s.d||'')+' '+(s.t||''); } }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
/* the reader's feed: their state only, their district first (like the Telangana app) */
function pick(){ const a=cur(); let L=a.st==='all'?ALL.slice():ALL.filter(s=>(s.sec||[]).includes(a.st));
  if(a.dist){ const mine=L.filter(s=>(s.dist||[]).includes(a.dist)); L=mine.concat(L.filter(s=>!(s.dist||[]).includes(a.dist))); }
  list=L.concat(ALL.length?[{end:1}]:[]); if(i>=list.length) i=0; }
function card(s){
  if(s.end){ const a=cur();
    return `<article class="card ecard" id="card"><h2>You're all caught up ✅</h2><p>That's the latest news for ${esc(aname(a))}${a.dist?' and the rest of '+esc(SNAME(a.st)):''}.</p>
      <button class="pri" type="button" data-loc="1">📍 Change district or search a place</button>
      ${viewing&&AREA?`<button type="button" data-home="1">Back to my district (${esc(aname(AREA))})</button>`:''}</article>`; }
  const share=location.origin+'/in-regions/?s='+sid(s);
  const wa='https://wa.me/?text='+encodeURIComponent(s.h+'\n'+share);
  return `<article class="card" id="card">
    <div class="pic"><img class="mark" src="/art/logo.svg" alt=""><span class="pill">${esc(s.cat)}</span>
      <div class="num"><b>${esc(s.stat)}</b><span>${esc(s.statl)}</span></div><i class="dot"></i></div>
    <div class="body"><h1>${esc(s.h)}</h1>
      <div class="meta"><span>${esc(when(s))}</span>${s.lbl?`<span class="lbl ${esc(s.lbl)}">${LBL[s.lbl]||esc(s.lbl)}</span>`:''}</div>
      <p class="sum">${esc(s.p)}</p>
      <div class="src"><span>Source: ${esc(s.src)}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">Read full story ›</a></div></div>
    <div class="acts"><button type="button" id="share">↗ Share</button><a class="wa" href="${wa}" target="_blank" rel="noopener">WhatsApp</a></div>
  </article>`; }
function show(dir){
  pick(); const st=$('stage');
  if(!list.length){ st.innerHTML='<div class="empty">No stories here yet. Come back soon.</div>'; $('count').textContent=''; return; }
  st.innerHTML=card(list[i]); const c=$('card');
  if(dir){ c.style.transform=`translateX(${dir*40}px)`; c.style.opacity='.3'; requestAnimationFrame(()=>{ c.style.transform=''; c.style.opacity=''; }); }
  const nn=list.length-1; $('count').textContent=list[i].end?'✓':(i+1)+'/'+nn; $('dock').style.setProperty('--prog',(Math.min(i+1,nn)/Math.max(nn,1)*100)+'%');
  $('prev').disabled=i===0; $('next').textContent=i===list.length-1?'Start again ↺':'Next ›';
  if($('share')) $('share').onclick=()=>{ const s=list[i], u=location.origin+'/in-regions/?s='+sid(s);
    if(navigator.share) navigator.share({title:s.h,text:s.h,url:u}).catch(()=>{}); else { navigator.clipboard&&navigator.clipboard.writeText(u); toast('Link copied'); } };
  c.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>openLoc(false));
  c.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{ viewing=null; i=0; show(0); });
  swipe(c);
}
function go(d){ if(!list.length) return; const n=i+d; if(n<0) return; i=n>=list.length?0:n; show(d); }
function swipe(c){ let x0=null,y0=0,dx=0;
  c.addEventListener('pointerdown',e=>{ if(e.target.closest('a,button')) return; x0=e.clientX; y0=e.clientY; dx=0; });
  c.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; if(Math.abs(dx)>Math.abs(e.clientY-y0)) c.style.transform=`translateX(${dx*.6}px) rotate(${dx/60}deg)`; });
  const end=()=>{ if(x0===null) return; x0=null; c.style.transform=''; if(dx<-60) go(1); else if(dx>60) go(-1); };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end); c.addEventListener('pointerleave',end); }

/* ---- welcome / location: state → district ---- */
function norm(t){ return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
const cnt=(st,d)=>ALL.filter(s=>(s.sec||[]).includes(st)&&(!d||(s.dist||[]).includes(d))).length;
function search(t,only){ const n=norm(t); if(n.length<2) return []; const out=[], seen=new Set();
  for(const k of ORDER){ if(only&&k!==only) continue; const S=ST[k]; if(!S) continue;
    const add=(label,dist)=>{ const m=norm(label); if(!(m.startsWith(n)||(n.length>2&&m.includes(n)))) return; const key=k+'|'+dist+'|'+label; if(seen.has(key)) return; seen.add(key);
      out.push({st:k,dist,label,start:m.startsWith(n)}); };
    if(!only) add(S.name,'');
    for(const d of S.districts) add(d,d);
    for(const [a,d] of Object.entries(S.alias||{})) add(a,d); }
  return out.sort((a,b)=>b.start-a.start||a.label.length-b.label.length).slice(0,8); }
function resBtn(x){ const sub=x.dist?(x.label!==x.dist?x.dist+' · ':'')+SNAME(x.st):'Whole state';
  return `<button type="button" data-st="${x.st}" data-d="${esc(x.dist)}">${esc(x.label)}<small>${esc(sub)}</small></button>`; }
function drawLoc(){ const t=$('locQ').value, only=step==='district'?stepSt:null, R=search(t,only);
  $('locRes').innerHTML=t.trim().length<2?'':(R.length?R.map(resBtn).join(''):'<div class="note">No match. We cover Uttar Pradesh, Delhi, Maharashtra (incl. Mumbai), Tamil Nadu (incl. Chennai) and Odisha.</div>');
  const mine=a=>AREA&&AREA.st===a.st&&(AREA.dist||'')===(a.dist||'');
  if(step==='start'){
    $('locNote').textContent='Or pick your state'; $('locList').className='rgl';
    $('locList').innerHTML=ORDER.filter(k=>ST[k]).map(k=>`<button type="button" data-pickst="${k}">${esc(ST[k].name)}<small>${HINT[k]?esc(HINT[k]):cnt(k)+' stories'}</small></button>`).join('');
  } else {
    const S=ST[stepSt], ds=S.districts.slice().sort((a,b)=>(b===nearD)-(a===nearD));
    $('locNote').textContent='Your district – '+S.districts.length+' in '+S.name; $('locList').className='rgl one';
    $('locList').innerHTML=`<button type="button" class="whole" data-st="${stepSt}" data-d="">Whole ${esc(S.name)}<small>${cnt(stepSt)} stories</small></button>`+
      ds.map(d=>`<button type="button" class="${d===nearD?'near':''}" data-st="${stepSt}" data-d="${esc(d)}">${d===nearD?'📍 ':''}${esc(d)}<small>${mine({st:stepSt,dist:d})?'⭐ Yours':(d===nearD?'Near you':(cnt(stepSt,d)?cnt(stepSt,d)+(cnt(stepSt,d)>1?' stories':' story'):''))}</small></button>`).join('');
  }
  const v=viewing&&!mine(viewing)?viewing:null; $('locSave').hidden=!v||step!=='start'; if(v) $('locSave').textContent='⭐ Make '+aname(v)+' my district'; }
function setStep(st,near){ step=st?'district':'start'; stepSt=st||null; nearD=near||null;
  $('locBack').hidden=!st; $('wLogo').hidden=!firstAsk||!!st; $('gps').hidden=!!st;
  $('locT').textContent=st?'Choose your district':(firstAsk?'Welcome to Swipe2News 👋':'📍 Change district');
  $('locSub').textContent=st?(near?'📍 We think you\'re in '+near+'. Tap it, or pick another.':'Your district\'s news comes first, then the rest of '+ST[st].name+'.')
    :(firstAsk?"Where are you? Pick your district and we'll show its news first – just like home.":(AREA?'Your district: '+aname(AREA)+'. Search any place to read its news.':'Search any place to read its news.'));
  $('locQ').placeholder=st?'Search district or city in '+ST[st].name:'Search your district or city, e.g. Pune';
  $('locClose').textContent=st?'Cancel':(firstAsk?'Show all states':'Close');
  $('locQ').value=''; drawLoc(); $('locSheet').firstElementChild.scrollTop=0; }
function openLoc(first){ firstAsk=!!first; $('locSheet').classList.toggle('wel',!!first); $('locSheet').hidden=false; setStep(null); }
function saveArea(a,how){ AREA={st:a.st,dist:a.dist||'',how,at:Date.now()}; lsSet('s2n.area',JSON.stringify(AREA)); }
function choose(st,dist,how){ const a={st,dist:dist||''};
  if(firstAsk||!AREA){ saveArea(a,how); viewing=null; toast('📍 Your district: '+aname(a)); }   // welcome → becomes the reader's district
  else { viewing=a; toast('Showing news for '+aname(a)); }                                     // later search → only changes the view
  $('locSheet').hidden=true; i=0; show(0); }
$('locQ').oninput=drawLoc;
$('locQ').onkeydown=e=>{ if(e.key==='Enter'){ const R=search($('locQ').value,step==='district'?stepSt:null); if(R[0]) choose(R[0].st,R[0].dist,'search'); } };
$('locRes').onclick=$('locList').onclick=e=>{ const ps=e.target.closest('[data-pickst]'); if(ps){ setStep(ps.dataset.pickst); return; }
  const b=e.target.closest('[data-st]'); if(b) choose(b.dataset.st,b.dataset.d,'pick'); };
$('locBack').onclick=()=>setStep(null);
$('locSave').onclick=()=>{ if(viewing){ saveArea(viewing,'search'); toast('⭐ '+aname(viewing)+' is now your district'); viewing=null; drawLoc(); } };
$('locClose').onclick=()=>{ if(step==='district'){ setStep(null); return; } $('locSheet').hidden=true;
  if(firstAsk){ saveArea({st:'all',dist:''},'pick'); i=0; show(0); } };
$('locSheet').onclick=e=>{ if(e.target===$('locSheet')&&!firstAsk) $('locSheet').hidden=true; };
$('gps').onclick=()=>{ const b=$('gps');
  if(!navigator.geolocation){ toast('Location is not available – please search or pick your state'); return; }
  b.textContent='📍 Finding you…'; b.disabled=true;
  navigator.geolocation.getCurrentPosition(p=>{ b.disabled=false; b.textContent='📍 Use my current location';
    const {latitude:la,longitude:lo}=p.coords; let best=null;
    for(const k of ORDER) for(const [d,[a,o]] of Object.entries((ST[k]||{}).pts||{})){ const km=Math.hypot(la-a,(lo-o)*Math.cos(la*Math.PI/180))*111; if(!best||km<best.km) best={k,d,km}; }
    if(best&&best.km<300) setStep(best.k,best.km<60?best.d:null);   // open that state's district list, nearest district on top
    else toast("You're outside these states – please search or pick one");
  },()=>{ b.disabled=false; b.textContent='📍 Use my current location'; toast('Location not allowed – please search or pick your state'); },{timeout:10000,maximumAge:600000}); };
function use(d,dd){ ALL=(d&&d.stories)||[]; ST=(dd&&dd.states)||{};
  if(AREA&&AREA.st!=='all'&&!ST[AREA.st]) AREA=null;
  const want=q.get('s'); if(want){ const k=ALL.findIndex(s=>sid(s)===want); if(k>=0){ viewing={st:'all',dist:''}; pick(); i=list.indexOf(ALL[k]); } }
  if((!AREA&&!want)||q.get('welcome')==='1') openLoc(true);
  show(0); }
async function load(){
  try{ const [r,r2]=await Promise.all([fetch(FEED,{cache:'no-cache'}),fetch(DFILE,{cache:'no-cache'})]); if(!r.ok||!r2.ok) throw 0; use(await r.json(),await r2.json()); }
  catch(e){ $('stage').innerHTML='<div class="empty">Could not load the news. Check your internet and try again.</div>'; }
}
$('prev').onclick=()=>go(-1); $('next').onclick=()=>go(1);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
load();
})();
</script>
