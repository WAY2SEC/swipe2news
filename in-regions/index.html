<style>

.ed{gap:8px}.ed b{font:800 10px var(--ui);letter-spacing:.08em;color:var(--deep);background:var(--apricot);border-radius:6px;padding:2px 6px}

.sheet>div{max-height:86vh;overflow-y:auto}

</div></div>

<script>
/* Swipe2News – India Regions PREVIEW (26 Nov 2026): Uttar Pradesh, Delhi, Mumbai, Maharashtra, Chennai, Odisha.
   Reads /editions/in-regions/news.json (same format as the other editions).
   Not linked from the app, no alerts, no redirects. No region row or location button at the top (owner, 27 Nov):
   the welcome screen on first open sets the reader's area; 'Change area or search a place' sits on the last card.
   ?r=<region key> opens one region directly; ?welcome=1 shows the welcome again (testing). */
(function(){
const FEED='/editions/in-regions/news.json';
const SECS=[['all','All'],['up','Uttar Pradesh'],['delhi','Delhi'],['mumbai','Mumbai'],['maharashtra','Maharashtra'],['chennai','Chennai'],['odisha','Odisha']];
/* Where the reader is. Order (owner, 27 Nov 2026):
   1) area saved with the reader's profile / chosen earlier (localStorage 's2n.area' – becomes the login profile's area when login exists),
   2) first open with no area: ask – phone location (GPS) or search/pick,
   3) anyone can search any city/district by hand; that only changes what they see, unless they tap "Make this my area". */
const PLACES={up:['Uttar Pradesh','UP','Lucknow','Kanpur','Varanasi','Banaras','Prayagraj','Allahabad','Agra','Noida','Greater Noida','Ghaziabad','Meerut','Gorakhpur','Bareilly','Aligarh','Moradabad','Ayodhya','Mathura','Jhansi','Saharanpur','Firozabad'],
 delhi:['Delhi','New Delhi','NCR','Dwarka','Rohini','Saket','Shalimar Bagh','Karol Bagh','Connaught Place','Pragati Maidan','Laxmi Nagar','Janakpuri'],
 mumbai:['Mumbai','Bombay','Thane','Navi Mumbai','Kalyan','Dombivli','Borivali','Andheri','Bandra','Dadar','Kurla','Vasai','Virar','Panvel','Colaba','Malad','Mira Road'],
 maharashtra:['Maharashtra','Pune','Nagpur','Nashik','Chhatrapati Sambhajinagar','Aurangabad','Kolhapur','Solapur','Dharashiv','Osmanabad','Satara','Sangli','Amravati','Latur','Nanded','Jalgaon','Ahilyanagar','Ahmednagar','Akola','Ratnagiri'],
 chennai:['Chennai','Madras','Tamil Nadu','Tambaram','Guindy','Velachery','Adyar','T Nagar','Anna Nagar','Kovalam','Chengalpattu','Kanchipuram','Coimbatore','Madurai','Tiruchirappalli','Trichy','Salem'],
 odisha:['Odisha','Orissa','Bhubaneswar','Cuttack','Puri','Rourkela','Sambalpur','Berhampur','Brahmapur','Balasore','Konark','Jharsuguda','Angul','Baripada']};
const PTS={up:[[26.85,80.95],[26.45,80.33],[25.32,82.97],[27.18,78.01],[26.76,83.37],[28.98,77.71],[25.44,81.85]],delhi:[[28.61,77.21]],
 mumbai:[[19.08,72.88],[19.22,73.16]],maharashtra:[[18.52,73.86],[21.15,79.09],[20.0,73.79],[19.88,75.34],[16.70,74.24],[17.66,75.91],[19.15,77.31]],
 chennai:[[13.08,80.27],[11.02,76.96],[9.93,78.12]],odisha:[[20.30,85.82],[20.46,85.88],[21.47,83.97],[22.26,84.85],[19.31,84.79]]};
const RNAME=k=>(SECS.find(x=>x[0]===k)||[,''])[1];
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let AREA=null; try{AREA=JSON.parse(lsGet('s2n.area')||'null')}catch(e){}
const LBL={fact:'FACT',claim:'CLAIM',opinion:'OPINION',forecast:'FORECAST'};
const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=new URLSearchParams(location.search);
let ALL=[], list=[], i=0, sec=SECS.some(([k])=>k===q.get('r'))?q.get('r'):(AREA&&AREA.r)||'all', viewing=null;
function sid(s){ let h=5381; const t=(s.url||'')+'|'+(s.h||''); for(let k=0;k<t.length;k++) h=((h<<5)+h+t.charCodeAt(k))|0; return (h>>>0).toString(36); }
function when(s){ try{ const d=new Date(s.pub), o={day:'numeric',month:'short',timeZone:'Asia/Kolkata'};
  if(s.t){ o.hour='2-digit'; o.minute='2-digit'; o.hour12=false; } return d.toLocaleString('en-IN',o)+(s.t?' IST':''); }catch(e){ return (s.d||'')+' '+(s.t||''); } }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),1800); }
function chips(){ return;  const have=new Set(ALL.flatMap(s=>s.sec||[]));
  $('chips').innerHTML=SECS.filter(([k])=>k==='all'||have.has(k)).map(([k,l])=>`<button class="chip" type="button" data-s="${k}" aria-pressed="${k===sec}">${l}</button>`).join(''); }
function pick(){ list=(sec==='all'?ALL:ALL.filter(s=>(s.sec||[]).includes(sec))).concat(ALL.length?[{end:1}]:[]); if(i>=list.length) i=0; }
function card(s){
  if(s.end){ const nm=viewing?viewing.name:(AREA&&AREA.r!=='all'?AREA.name:'all regions');
    return `<article class="card ecard" id="card"><h2>You're all caught up ✅</h2><p>That's the latest news for ${esc(nm)}.</p>
      <button class="pri" type="button" data-loc="1">📍 Change area or search a place</button>
      ${viewing&&AREA?`<button type="button" data-home="1">Back to my area (${esc(AREA.r==='all'?'All regions':AREA.name)})</button>`:''}</article>`; }
  if(s.intro){ const n=k=>ALL.filter(x=>(x.sec||[]).includes(k)).length;
    return `<article class="card icard" id="card"><h2>India, region by region<i>.</i></h2>

      <div class="rg">${SECS.slice(1).map(([k,l])=>`<button type="button" data-go="${k}">${l}<small>${n(k)} stories</small></button>`).join('')}</div>
      <div class="hint">Swipe for all stories ›</div></article>`; }
  const share=location.origin+'/in-regions/?s='+sid(s);
  const wa='https://wa.me/?text='+encodeURIComponent(s.h+'\n'+share);
  return `<article class="card" id="card">
    <div class="pic"><img class="mark" src="/art/logo.svg" alt=""><span class="pill">${esc(s.cat)}</span>
      <div class="num"><b>${esc(s.stat)}</b><span>${esc(s.statl)}</span></div><i class="dot"></i></div>
    <div class="body"><h1>${esc(s.h)}</h1>
      <div class="meta"><span>${esc(when(s))}</span>${s.lbl?`<span class="lbl ${esc(s.lbl)}">${LBL[s.lbl]||esc(s.lbl)}</span>`:''}</div>
      <p class="sum">${esc(s.p)}</p>
      <div class="src"><span>Source: ${esc(s.src)}</span><a href="${esc(s.url)}" target="_blank" rel="noopener">Read full story ›</a></div></div>
    <div class="acts"><button type="button" id="share">↗ Share</button><a class="wa" href="${wa}" target="_blank" rel="noopener">WhatsApp</a></div>
  </article>`; }
function show(dir){
  pick(); const st=$('stage');
  if(!list.length){ st.innerHTML='<div class="empty">No stories here yet. Come back soon.</div>'; $('count').textContent=''; return; }
  st.innerHTML=card(list[i]); const c=$('card');
  if(dir){ c.style.transform=`translateX(${dir*40}px)`; c.style.opacity='.3'; requestAnimationFrame(()=>{ c.style.transform=''; c.style.opacity=''; }); }
  const nn=list.length-1; $('count').textContent=list[i].end?'✓':(i+1)+'/'+nn; $('dock').style.setProperty('--prog',(Math.min(i+1,nn)/Math.max(nn,1)*100)+'%');
  $('prev').disabled=i===0; $('next').textContent=i===list.length-1?'Start again ↺':'Next ›';
  if($('share')) $('share').onclick=()=>{ const s=list[i], u=location.origin+'/in-regions/?s='+sid(s);
    if(navigator.share) navigator.share({title:s.h,text:s.h,url:u}).catch(()=>{}); else { navigator.clipboard&&navigator.clipboard.writeText(u); toast('Link copied'); } };
  c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setSec(b.dataset.go));
  c.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>openLoc(false));
  c.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>{ viewing=null; setSec(AREA.r); });
  swipe(c);
}
function setSec(k){ sec=k; i=0; show(0); }
function go(d){ if(!list.length) return; const n=i+d; if(n<0) return; i=n>=list.length?0:n; show(d); }
function swipe(c){ let x0=null,y0=0,dx=0;
  c.addEventListener('pointerdown',e=>{ if(e.target.closest('a,button')) return; x0=e.clientX; y0=e.clientY; dx=0; });
  c.addEventListener('pointermove',e=>{ if(x0===null) return; dx=e.clientX-x0; if(Math.abs(dx)>Math.abs(e.clientY-y0)) c.style.transform=`translateX(${dx*.6}px) rotate(${dx/60}deg)`; });
  const end=()=>{ if(x0===null) return; x0=null; c.style.transform=''; if(dx<-60) go(1); else if(dx>60) go(-1); };
  c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end); c.addEventListener('pointerleave',end); }
function use(d){ ALL=(d&&d.stories)||[]; chips(); areaLabel();
  if((!AREA&&!q.get('r')&&!q.get('s'))||q.get('welcome')==='1') openLoc(true); const want=q.get('s'); if(want){ const k=ALL.findIndex(s=>sid(s)===want); if(k>=0){ sec='all'; i=k; } } show(0); }

/* ---- location ---- */
function norm(t){ return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function areaLabel(){ return;  const v=viewing&&viewing.r===sec?viewing:(AREA&&AREA.r===sec?AREA:null);
  $('areaName').textContent=v?v.name:(sec==='all'?(AREA?AREA.name:'Location'):RNAME(sec)); }
function search(t){ const n=norm(t); if(n.length<2) return [];
  const out=[], seen=new Set();
  for(const [r,names] of Object.entries(PLACES)) for(const nm of names){ const m=norm(nm); if(m.startsWith(n)||(n.length>2&&m.includes(n))){ const key=r+nm; if(!seen.has(key)){ seen.add(key); out.push({r,name:nm,start:m.startsWith(n)}); } } }
  for(const s of ALL){ if(s.loc&&norm(s.loc).includes(n)) for(const r of s.sec||[]){ const key=r+s.loc; if(!seen.has(key)){ seen.add(key); out.push({r,name:s.loc,start:norm(s.loc).startsWith(n)}); } } }
  return out.sort((a,b)=>b.start-a.start).slice(0,8); }
function drawLoc(){ const t=$('locQ').value, R=search(t);
  $('locRes').innerHTML=t.trim().length<2?'':(R.length?R.map(x=>`<button type="button" data-r="${x.r}" data-n="${esc(x.name)}">${esc(x.name)}<small>${esc(RNAME(x.r))}</small></button>`).join(''):'<div class="note">No news region for that place yet. We cover Uttar Pradesh, Delhi, Mumbai, Maharashtra, Chennai and Odisha.</div>');
  $('locList').innerHTML=SECS.slice(1).map(([k,l])=>`<button type="button" data-r="${k}" data-n="${esc(l)}" aria-pressed="${!!(AREA&&AREA.r===k)}">${esc(l)}<small>${AREA&&AREA.r===k?'⭐ Yours':ALL.filter(s=>(s.sec||[]).includes(k)).length+' stories'}</small></button>`).join('');
  const v=viewing&&(!AREA||viewing.r!==AREA.r||viewing.name!==AREA.name)?viewing:null; $('locSave').hidden=!v; if(v) $('locSave').textContent='⭐ Make '+v.name+' my area'; }
let firstAsk=false;
function openLoc(first){ firstAsk=!!first; $('locSheet').classList.toggle('wel',!!first); $('wLogo').hidden=!first; $('locT').textContent=first?'Welcome to Swipe2News 👋':'📍 Change area';
  $('locSub').textContent=first?"Where are you? We'll show the news from your area.":(AREA?'Your area: '+AREA.name+' ('+RNAME(AREA.r)+'). Search any place to read its news.':'Search any place to read its news.');
  $('locQ').value=''; drawLoc(); $('locSheet').hidden=false; }
function saveArea(a,how){ AREA={r:a.r,name:a.name,how,at:Date.now()}; lsSet('s2n.area',JSON.stringify(AREA)); }
function choose(r,name,how){ const a={r,name};
  if(firstAsk||!AREA||how==='gps'){ saveArea(a,how); viewing=null; toast('📍 Your area: '+name); }   // first open / GPS → becomes the reader's area
  else { viewing=a; toast('Showing news for '+name); }                                              // manual search → only changes the view
  lsSet('s2n.asked','1'); $('locSheet').hidden=true; setSec(r); }
$('locQ').oninput=drawLoc;
$('locQ').onkeydown=e=>{ if(e.key==='Enter'){ const R=search($('locQ').value); if(R[0]) choose(R[0].r,R[0].name,'search'); } };
$('locRes').onclick=$('locList').onclick=e=>{ const b=e.target.closest('[data-r]'); if(b) choose(b.dataset.r,b.dataset.n,'search'); };
$('locSave').onclick=()=>{ if(viewing){ saveArea(viewing,'search'); toast('⭐ '+viewing.name+' is now your area'); viewing=null; drawLoc(); areaLabel(); } };
$('locClose').onclick=()=>{ $('locSheet').hidden=true; if(firstAsk){ saveArea({r:'all',name:'All regions'},'pick'); lsSet('s2n.asked','1'); setSec('all'); } };
$('locSheet').onclick=e=>{ if(e.target===$('locSheet')&&!firstAsk) $('locClose').onclick(); };
$('gps').onclick=()=>{ const b=$('gps');
  if(!navigator.geolocation){ toast('Location is not available – please search or pick a region'); return; }
  b.textContent='📍 Finding you…'; b.disabled=true;
  navigator.geolocation.getCurrentPosition(p=>{ b.disabled=false; b.textContent='📍 Use my current location';
    const {latitude:la,longitude:lo}=p.coords; let best=null;
    for(const [r,pts] of Object.entries(PTS)) for(const [a,o] of pts){ const d=Math.hypot(la-a,(lo-o)*Math.cos(la*Math.PI/180))*111; if(!best||d<best.d) best={r,d}; }
    if(best&&best.d<350){ firstAsk=true; choose(best.r,RNAME(best.r),'gps'); }
    else toast("You're outside these 6 regions – please search or pick one");
  },()=>{ b.disabled=false; b.textContent='📍 Use my current location'; toast('Location not allowed – please search or pick a region'); },{timeout:10000,maximumAge:600000}); };
async function load(){
  try{ const r=await fetch(FEED,{cache:'no-cache'}); if(!r.ok) throw 0; use(await r.json()); }
  catch(e){ $('stage').innerHTML='<div class="empty">Could not load the news. Check your internet and try again.</div>'; }
}
$('prev').onclick=()=>go(-1); $('next').onclick=()=>go(1);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); });
load();
})();
</script>
