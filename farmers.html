/* preferences: same storage as the news app (w2s.*) */

let WX=null, FARM=null;
Promise.all([fetch('/weather.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>null),fetch('/farm.json',{cache:'no-cache'}).then(r=>r.json()).catch(()=>null)]).then(([w,f])=>{WX=w;FARM=f;week();});
/* ---------- weekly cards (verified, dated, district-filtered) ---------- */
let CARDS=[];
function build(){ const d=dd(); if(!d) return []; const out=[], st=stOf(d);
  // 1) IMD agro-weather bulletin for this district (Telangana feed only)
  const rec=WX&&WX.d&&WX.d[D], bul=WX&&WX.bulletins&&WX.bulletins[st];
  if(rec&&rec.days&&rec.days.length&&bul&&!bul.stale){ const ds=rec.days, warn=ds.map(x=>x.warn).filter(Boolean)[0]||'';

    out.push({id:'wx-'+D+'-'+(bul.issued||''),cat:'weather',local:true,warn:!!warn,icon:wet.length||warn?'rain':'sun',
      h:warn?t().wxW(warn):t().wxH(ds.length,wet.length),p:t().wxP(Math.max(...ds.map(x=>x.tmax)),Math.min(...ds.map(x=>x.tmin)),rain,rd),
      when:t().valid(fmt(ds[0].date),fmt(ds[ds.length-1].date)),src:'IMD Hyderabad · '+(bul.name||'')+(bul.no?' '+bul.no:''),url:bul.url,more:bul.url,moreL:t().bul,scope:dn(d)}); }

  const items=(FARM&&FARM.items)||[], others=DIST.filter(x=>x[0]!==D).map(x=>x[1]);
  const mine=items.filter(x=>x.place===D), wide=items.filter(x=>(st==='TG'?x.place==='TS':x.place==='AP')&&x.cat!=='procure'&&!others.some(n=>(x.te.h||'').includes(n))); // a procurement centre is always in one place, so never shown state-wide
  for(const x of [...mine,...wide]){ const c=x[L]&&x[L].h?x[L]:x.te; const first=(c.p||'').split(/(?<=[.।!?])\s+/)[0];
    out.push({id:x.id,cat:x.cat,crop:x.crop,h:c.h,p:c.why||first,when:t().pub(fmt(x.pub)),src:x.src,url:x.url,more:'/?s='+x.id,moreL:t().more,
      img:x.img?'/'+x.img.replace(/^\//,''):'/art/'+((x.cat!=='crop'&&x.cat!=='price'&&PIC[x.cat])||PIC[x.crop]||PIC[x.cat]||PIC.crop)+'.webp',ai:!x.img,scope:x.place===D?dn(d):t().state[st],local:x.place===D}); }
  // alerts and deadlines first

  const rank=c=>c.warn?4:c.local&&(c.cat==='alert'||c.cat==='procure')?3:c.cat==='weather'?2:c.local?1:0;

function cardHTML(c,i,n){ const tt=t(), lab=[c.crop&&tt.crop[c.crop],tt.cat[c.cat]].filter(Boolean).join(' · ');
  const ph=c.img?`<div class="ph" style="background-image:url('${esc(c.img)}')">${c.ai?`<span class="ai">${tt.ai}</span>`:''}</div>`:`<div class="ph icon">${SVG(IC[c.icon],c.warn?'#B3261E':'#B36B00',64)}</div>`;
  return `<div class="slot" data-i="${i}"><article class="card" id="c-${esc(c.id)}">${ph}<div class="cb">
    <div class="lab"><span class="chip ${c.cat==='weather'?'w':'g'}">${esc(lab)}</span><span class="d">${esc(c.scope)}</span></div>
    <h2>${esc(c.h)}</h2><div class="tk">${esc(c.p)}</div>
    <div class="meta"><span>${esc(c.when)}</span><span>· ${tt.src}: ${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.src)}</a>`:esc(c.src)}</span></div>
    <div class="acts">${c.more?`<a href="${esc(c.more)}"${/^http/.test(c.more)?' target="_blank" rel="noopener"':''}>${SVG(IC.more,'#4A0E3F',16)}${esc(c.moreL)}</a>`:''}<span class="sp"></span><button class="sh" type="button" data-share="${i}">${SVG(IC.share,'#fff',16)}${tt.share}</button></div>
  </div></article></div>`; }
function week(){ const tt=t(); CARDS=build(); const f=$('feed');
  if(!dd()){ f.innerHTML=`<div class="slot"><div class="empty"><p>${tt.pickfirst}</p><button type="button" onclick="document.getElementById('dist').focus()">${tt.pick}</button></div></div>`; $('cnt').hidden=true; return; }
  if(!CARDS.length){ f.innerHTML=`<div class="slot"><div class="empty"><p>${tt.empty}</p><button type="button" id="goCal">${tt.open}</button></div></div>`; $('cnt').hidden=true; $('goCal').onclick=()=>tab('cal'); return; }
  $('cnt').hidden=false; f.innerHTML=CARDS.map((c,i)=>cardHTML(c,i,CARDS.length)).join('');
  f.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>openShare(+b.dataset.share));
  let k=WANT?CARDS.findIndex(c=>c.id===WANT):0; if(k<0) k=0; WANT='';
  f.scrollLeft=k*f.clientWidth; num(k); }
function idx(){ const f=$('feed'); return Math.round(f.scrollLeft/Math.max(1,f.clientWidth)); }
function num(k){ $('num').textContent=CARDS.length?`${(k??idx())+1} / ${CARDS.length}`:''; }
function goCard(k){ const f=$('feed'); k=Math.max(0,Math.min(CARDS.length-1,k)); f.scrollTo({left:k*f.clientWidth,behavior:'smooth'}); }
$('feed').addEventListener('scroll',()=>{ clearTimeout(num.t); num.t=setTimeout(()=>num(),60); },{passive:true});
$('pv').innerHTML=SVG(IC.l); $('nx').innerHTML=SVG(IC.r); $('pv').onclick=()=>goCard(idx()-1); $('nx').onclick=()=>goCard(idx()+1);
/* ---------- share: 1080×1920 Status image + exact-card link ---------- */
let SHI=0;
const link=c=>`https://swipe2news.com/farmers.html?d=${encodeURIComponent(D)}&c=${encodeURIComponent(c.id)}`;
function openShare(i){ SHI=i; const tt=t(); $('shT').textContent=tt.shT;
  $('shImg').innerHTML=`${SVG(IC.img,'#4A0E3F',22)}<span>${tt.shImg}<small>${tt.shImgS}</small></span>`; $('shLink').innerHTML=`${SVG(IC.link,'#4A0E3F',22)}<span>${tt.shLink}<small>${tt.shLinkS}</small></span>`;
  $('shX').textContent=tt.close; $('sheet').hidden=false; }
$('shX').onclick=()=>$('sheet').hidden=true; $('sheet').onclick=e=>{ if(e.target===$('sheet')) $('sheet').hidden=true; };
$('shLink').onclick=async()=>{ const c=CARDS[SHI], u=link(c), txt=`🌾 ${c.h}\n${u}\n📲 Swipe2News™`; $('sheet').hidden=true;
  try{ if(navigator.share){ await navigator.share({text:txt}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(txt); toast(t().copied); }catch(e){ prompt('',u); } };
const loadImg=src=>new Promise(r=>{ const im=new Image(); im.onload=()=>r(im); im.onerror=()=>r(null); im.src=src; });
function wrap(x,s,w,max){ const words=String(s).split(/\s+/), out=[]; let line='';
  for(const wd of words){ const tst=line?line+' '+wd:wd; if(x.measureText(tst).width>w&&line){ out.push(line); line=wd; } else line=tst; } if(line) out.push(line);
  if(out.length>max){ out.length=max; out[max-1]=out[max-1].replace(/\s*\S*$/,'')+' …'; } return out; }
async function statusImage(c){ const F='"Noto Sans Telugu","Nirmala UI",sans-serif', tt=t();
  try{ await Promise.all(['800 64px "Noto Sans Telugu"','500 40px "Noto Sans Telugu"','700 30px "Noto Sans Telugu"'].map(f=>document.fonts.load(f,'తెలుగు'))); }catch(e){}
  const W=1080,H=1920, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  x.fillStyle='#2E0827'; x.fillRect(0,0,W,H);
  const top=250, P=70; // top 250px and bottom 300px stay free for Status bars
  const logo=await loadImg('/logo-light.png'); /* wordmark with the apricot dot and ™ */ if(logo){ const lw=420, lh=lw*logo.height/logo.width; x.drawImage(logo,P,top,lw,lh); }
  x.fillStyle='#F5A23A'; x.font=`700 30px ${F}`; x.textAlign='right'; x.fillText(L==='te'?'రైతు స్వైప్':'Rythu Swipe',W-P,top+48); x.textAlign='left';
  let y=top+120; const ph=c.img?await loadImg(c.img):null;
  if(ph){ const bw=W-2*P, bh=560, sc=Math.max(bw/ph.width,bh/ph.height), sw=bw/sc, sh=bh/sc;
    x.save(); x.beginPath(); x.roundRect(P,y,bw,bh,36); x.clip(); x.drawImage(ph,(ph.width-sw)/2,(ph.height-sh)/2,sw,sh,P,y,bw,bh); x.restore();
    if(c.ai){ x.font=`600 22px ${F}`; x.fillStyle='rgba(46,8,39,.6)'; const tw=x.measureText(tt.ai).width+24; x.beginPath(); x.roundRect(P+18,y+bh-52,tw,36,18); x.fill(); x.fillStyle='#fff'; x.fillText(tt.ai,P+30,y+bh-26); }
    y+=bh+60; } else { const bw=W-2*P, bh=460; const g=x.createLinearGradient(0,y,0,y+bh); g.addColorStop(0,'#FFF3E2'); g.addColorStop(1,'#FBE0BD'); x.fillStyle=g; x.beginPath(); x.roundRect(P,y,bw,bh,36); x.fill();
      const ic=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 24 24" fill="none" stroke="${c.warn?'#B3261E':'#B36B00'}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IC[c.icon]}</svg>`));
      if(ic) x.drawImage(ic,(W-320)/2,y+(bh-320)/2,320,320); y+=bh+60; }
  const lab=[c.crop&&tt.crop[c.crop],tt.cat[c.cat]].filter(Boolean).join(' · ')+'  ·  '+c.scope;
  x.font=`700 30px ${F}`; x.fillStyle=c.cat==='weather'?'#F5A23A':'#8FD3A6'; x.fillText(lab,P,y); y+=36;
  x.font=`800 62px ${F}`; x.fillStyle='#FFFDF8'; for(const l of wrap(x,c.h,W-2*P,3)){ y+=82; x.fillText(l,P,y); }
  x.font=`500 38px ${F}`; x.fillStyle='#EBDCE6'; y+=24; for(const l of wrap(x,c.p,W-2*P,4)){ y+=56; x.fillText(l,P,y); }
  const yb=H-300-120; x.fillStyle='rgba(255,255,255,.14)'; x.fillRect(P,yb-36,W-2*P,2);
  x.font=`700 28px ${F}`; x.fillStyle='#F5A23A'; x.fillText(c.when,P,yb+4);
  x.font=`500 26px ${F}`; x.fillStyle='#D9C6D1'; for(const [k,l] of wrap(x,tt.src+': '+c.src,W-2*P,2).entries()) x.fillText(l,P,yb+46+k*36);
  x.font=`700 26px ${F}`; x.fillStyle='#FFFDF8'; x.fillText('swipe2news.com/farmers.html',P,yb+130);
  return await new Promise(r=>cv.toBlob(r,'image/jpeg',.92)); }
$('shImg').onclick=async()=>{ const c=CARDS[SHI]; $('sheet').hidden=true; toast(t().making); const b=await statusImage(c); if(!b) return;
  const f=new File([b],'swipe2news-rythu-'+c.id+'.jpg',{type:'image/jpeg'});
  try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }

/* ---------- full calendar (reference content) ---------- */
const season=m=>m>=5&&m<=9?[0]:m===2?[1,2]:m>=10||m<=1?[1]:[2], li=()=>L==='te'?0:1;
function cal(){ const tt=t(), m=M[sel], d=dd(), sp=d&&SPEC[D], rg=d?d[3]:'';
  const rows=[['sow',tt.sow,m.sow],['har',tt.har,m.har],['act',tt.act,m.act],['fes',tt.fes,m.fes]].map(([k,b,v])=>`<div class="row"><span class="ic">${SVG(IC[k],k==='har'?'#1F6B3A':'#4A0E3F')}</span><span><b>${b}</b><div>${esc(v[li()])}</div></span></div>`).join('');
  $('cal').innerHTML=`<div class="seas">${tt.seas.map((s,k)=>`<span class="${season(cur).includes(k)?'on':''}">${s}</span>`).join('')}</div>
   <div class="mrow" id="mrow">${SH[L].map((s,k)=>`<button type="button" class="${k===cur?'now':''}${k===sel?' sel':''}" data-m="${k}">${s}</button>`).join('')}</div>
   <div class="mc${sel===cur?' cur':''}" id="mc"><div class="mtop"><button class="nav" id="mp" type="button" aria-label="previous month">${SVG(IC.l)}</button><span class="tag${sel===cur?'':' alt'}">${sel===cur?tt.now:tt.other}</span>
   ${sel!==cur?`<button class="back" id="mb" type="button">${tt.back}</button>`:''}<span class="sp"></span><button class="nav" id="mn" type="button" aria-label="next month">${SVG(IC.r)}</button></div>
   <h3>${m[L]}</h3>${sp?`<div class="spec">📍 ${esc(tt.spec(dn(d),sp[li()]))}</div>`:''}${rows}<div class="src">${tt.csrc}</div></div>
   <h4>${tt.regT}</h4>${R.map((r,k)=>`<div class="rg${['tg','ca','rs'][k]===rg?' mine':''}"><b>${L==='te'?r[0]:r[1]}</b><div>${esc(L==='te'?r[2]:r[3])}</div></div>`).join('')}<div class="note">${tt.note}</div>`;
  $('cal').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{sel=+b.dataset.m;cal();});
  $('mp').onclick=()=>{sel=(sel+11)%12;cal()}; $('mn').onclick=()=>{sel=(sel+1)%12;cal()}; if($('mb')) $('mb').onclick=()=>{sel=cur;cal()};
  const b=$('mrow').querySelector('.sel'); if(b) b.scrollIntoView({inline:'center',block:'nearest'});
  let sx=null; $('mc').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true}); $('mc').addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>60){ sel=(sel+(dx<0?1:11))%12; cal(); } },{passive:true}); }

  $('dist').innerHTML=`<option value="">${tt.pick}</option>`+og('tg')+og('ap'); tab(TAB); }
